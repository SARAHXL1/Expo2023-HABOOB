<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هبوب | HABOOB — Smart Outdoor Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F2ED; --bg2:#ECE7DD; --surface:#FFFFFF; --surface2:#FAF8F4;
  --ink:#22201C; --ink2:#5A554C; --ink3:#8F887B; --line:#E3DDD1; --line2:#D6CEBE;
  --sand:#D9C49F; --sand-deep:#A8834F; --sand-soft:#F1E8D8;
  --brand:#1F6B4F; --brand-ink:#FFFFFF; --brand-soft:#E3EFE8;
  --ok:#2E8A5A; --ok-bg:#E4F2EA; --cau:#C9940E; --cau-bg:#FBF1D6; --heat:#D9661F; --heat-bg:#FCE8DA; --crit:#C2362B; --crit-bg:#F9E1DE;
  --info:#2F6C8F; --info-bg:#E1EDF4;
  --glass:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 24px -12px rgba(60,45,20,.18);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --side:248px;
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16150F; --bg2:#1E1C16; --surface:#211F19; --surface2:#1A1914;
    --ink:#F1ECE2; --ink2:#C2BAAA; --ink3:#8B8475; --line:#34302705; --line:#332F26; --line2:#454033;
    --sand:#8E7650; --sand-deep:#D3B583; --sand-soft:#2A261D;
    --brand:#4FB287; --brand-ink:#0E1A14; --brand-soft:#1D3128;
    --ok:#4FB287; --ok-bg:#1B2E24; --cau:#E5B53A; --cau-bg:#352C14; --heat:#EE8A4A; --heat-bg:#3A2416; --crit:#EE6A5E; --crit-bg:#3B1C19;
    --info:#6BA9CF; --info-bg:#182A35; --glass:rgba(33,31,25,.78);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#16150F; --bg2:#1E1C16; --surface:#211F19; --surface2:#1A1914;
  --ink:#F1ECE2; --ink2:#C2BAAA; --ink3:#8B8475; --line:#332F26; --line2:#454033;
  --sand:#8E7650; --sand-deep:#D3B583; --sand-soft:#2A261D;
  --brand:#4FB287; --brand-ink:#0E1A14; --brand-soft:#1D3128;
  --ok:#4FB287; --ok-bg:#1B2E24; --cau:#E5B53A; --cau-bg:#352C14; --heat:#EE8A4A; --heat-bg:#3A2416; --crit:#EE6A5E; --crit-bg:#3B1C19;
  --info:#6BA9CF; --info-bg:#182A35; --glass:rgba(33,31,25,.78);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:26px;line-height:1.25}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.sm{font-size:12.5px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;transition:width .25s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-weight:700;font-size:19px;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500;position:relative;transition:background .15s,color .15s}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.nav .count{margin-inline-start:auto;background:var(--crit);color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav-sep{height:1px;background:var(--line);margin:12px 8px}
.side-foot{margin-top:auto;padding:12px;border-radius:var(--r-md);background:var(--sand-soft);font-size:12.5px;color:var(--ink2)}
.side-foot b{color:var(--ink);display:block;margin-bottom:2px}
.loop{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.loop span{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .crumb{font-weight:600;font-size:15px}
.top .spacer{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
[dir=rtl] .clock{align-items:flex-start}
.clock .t{font-weight:600;font-size:15px}
.clock .d{font-size:11.5px;color:var(--ink3)}
.sys{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.live{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.icon-btn:hover{border-color:var(--line2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .badge-dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink3)}
.lang button.on{background:var(--ink);color:var(--bg)}
.user{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;border-radius:12px}
[dir=rtl] .user{padding:4px 12px 4px 4px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--sand),var(--sand-deep));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.user .n{font-weight:600;font-size:13px;line-height:1.2}
.user .r{font-size:11.5px;color:var(--ink3)}
.page{padding:24px 28px 80px;max-width:1600px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin-top:4px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--sand-soft);color:var(--sand-deep);font-weight:600;border:1px dashed var(--sand)}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head p{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px;border:1px solid transparent;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface2)}
.btn-text{background:none;color:var(--ink2);padding:9px 10px}
.btn-text:hover{color:var(--ink)}
.btn-danger{background:var(--crit);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.badge .dot{width:7px;height:7px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-ok .dot{background:var(--ok)}
.b-cau{background:var(--cau-bg);color:var(--cau)} .b-cau .dot{background:var(--cau)}
.b-heat{background:var(--heat-bg);color:var(--heat)} .b-heat .dot{background:var(--heat)}
.b-crit{background:var(--crit-bg);color:var(--crit)} .b-crit .dot{background:var(--crit)}
.b-info{background:var(--info-bg);color:var(--info)} .b-info .dot{background:var(--info)}
.b-neutral{background:var(--bg2);color:var(--ink2)} .b-neutral .dot{background:var(--ink3)}
.b-ai{background:linear-gradient(90deg,var(--brand-soft),var(--sand-soft));color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-size:5px 5px;background-repeat:no-repeat;background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%}
[dir=rtl] select.input{background-position:18px 50%,13px 50%}
.switch{width:40px;height:23px;border-radius:12px;background:var(--line2);border:0;position:relative;transition:background .2s;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--brand)}
.switch.on::after{inset-inline-start:20px}
.seg{display:inline-flex;background:var(--bg2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--ink3);text-align:start;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr.click:hover{background:var(--surface2);cursor:pointer}
.scroll-x{overflow-x:auto}
.empty{padding:40px;text-align:center;color:var(--ink3)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;cursor:default}
.kpi .k-label{font-size:12.5px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .k-val{font-size:32px;font-weight:600;line-height:1;transition:color .3s}
.kpi .k-foot{font-size:11.5px;color:var(--ink3)}
.kpi .bar{position:absolute;inset-inline-start:0;top:16px;bottom:16px;width:3px;border-radius:3px}
.kpi.flash .k-val{animation:flash 1.2s ease}
@keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- Map ---------- */
.map-wrap{position:relative;width:100%;aspect-ratio:1/1;max-height:720px;margin-inline:auto}
.map-wrap svg{width:100%;height:100%;display:block;direction:ltr}
.zone-shape{cursor:pointer;transition:filter .15s,stroke-width .15s}
.zone-shape:hover{filter:brightness(1.05) saturate(1.2);stroke-width:2.6}
.zone-shape.sel{stroke-width:3.2}
.zone-label{pointer-events:none;font-weight:600;font-family:inherit}
.crit-pulse{animation:cpulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes cpulse{0%,100%{opacity:.25}50%{opacity:.75}}
.pole{cursor:pointer}
.pole .ring{animation:pring 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.flash-ring{animation:fring 1.6s ease-out 3;transform-origin:center;transform-box:fill-box}
@keyframes fring{0%{opacity:1;stroke-width:6}100%{opacity:0;stroke-width:22}}
.map-pop{position:absolute;z-index:5;min-width:220px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;transform:translate(-50%,calc(-100% - 14px));font-size:12.5px;animation:popin .18s ease}
@keyframes popin{from{opacity:0;transform:translate(-50%,calc(-100% - 6px))}}
.map-pop .rows{display:grid;grid-template-columns:auto auto;gap:4px 18px;margin-top:8px}
.map-pop .rows span:nth-child(odd){color:var(--ink3)}
.map-pop .rows span:nth-child(even){font-weight:600;text-align:end}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.layer-list{display:flex;flex-direction:column;gap:2px}
.layer{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.layer:last-child{border-bottom:0}
.layer .sw{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.layer .sw svg{width:15px;height:15px}
.layer .txt{flex:1;line-height:1.3}
.layer .txt small{display:block;color:var(--ink3);font-size:11.5px}

/* ---------- Overview ---------- */
.ov-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:18px;align-items:start}
.quick{padding:18px 20px}
.quick-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.metric{padding:11px 13px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.metric .ml{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.metric .ml svg{width:14px;height:14px}
.metric .mv{font-size:19px;font-weight:600;margin-top:2px}
.metric .mv small{font-size:12px;color:var(--ink3);font-weight:500;margin-inline-start:2px}
.utci-hero{display:flex;align-items:baseline;gap:6px}
.utci-hero .v{font-size:44px;font-weight:600;line-height:1}
.alert-row{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:flex-start;transition:background .12s}
.alert-row:last-child{border-bottom:0}
.alert-row:hover{background:var(--surface2)}
.sev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.sev svg{width:17px;height:17px}
.sev.crit{background:var(--crit-bg);color:var(--crit)}
.sev.heat{background:var(--heat-bg);color:var(--heat)}
.sev.cau{background:var(--cau-bg);color:var(--cau)}
.sev.info{background:var(--info-bg);color:var(--info)}
.sev.ok{background:var(--ok-bg);color:var(--ok)}
.log{list-style:none;margin:0;padding:6px 20px 14px}
.log li{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;padding:9px 0;align-items:start;position:relative}
.log li .lt{font-size:12px;color:var(--ink3);padding-top:1px}
.log li .ld{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--line2);position:relative}
.log li:not(:last-child) .ld::after{content:"";position:absolute;top:12px;left:4px;width:1px;height:34px;background:var(--line)}
.log li .lx{font-size:13px}
.log li .lx small{display:block;color:var(--ink3);font-size:11.5px}
.log li.new{animation:newrow 2.4s ease}
@keyframes newrow{0%{background:var(--brand-soft)}100%{background:transparent}}

/* ---------- Zone details ---------- */
.zd-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.zd-status{padding:22px 24px;position:relative;overflow:hidden}
.zd-status .big{font-size:64px;font-weight:600;line-height:1;letter-spacing:-.02em}
.zd-status .big small{font-size:22px;color:var(--ink3);font-weight:500}
.scale{margin-top:20px}
.scale-bar{display:grid;grid-template-columns:repeat(5,1fr);height:12px;border-radius:6px;overflow:hidden;gap:2px;direction:ltr}
.scale-bar div:nth-child(1){background:#7DBF9A}.scale-bar div:nth-child(2){background:#E2C25B}.scale-bar div:nth-child(3){background:#E79A4F}.scale-bar div:nth-child(4){background:#D9563A}.scale-bar div:nth-child(5){background:#8E1F1A}
.scale-track{position:relative;height:22px;direction:ltr}
.scale-pin{position:absolute;top:0;transform:translateX(-50%);transition:left 1.2s cubic-bezier(.3,.8,.2,1);display:flex;flex-direction:column;align-items:center}
.scale-pin::before{content:"";width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid var(--ink)}
.scale-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font-size:11px;color:var(--ink3);margin-top:6px;direction:ltr;text-align:center}
[dir=rtl] .scale-labels span{direction:rtl}
.scale-labels span.on{color:var(--ink);font-weight:600}
.env-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.env{padding:16px 18px}
.env .el{display:flex;align-items:center;justify-content:space-between;color:var(--ink2);font-size:12.5px}
.env .el svg{width:18px;height:18px;color:var(--ink3)}
.env .ev{font-size:28px;font-weight:600;margin-top:6px;line-height:1.1}
.env .ev small{font-size:13px;color:var(--ink3);font-weight:500}
.env .eh{font-size:11.5px;margin-top:6px}
.env.flagged{border-color:color-mix(in srgb,var(--heat) 45%,var(--line))}
.env.flagged .eh{color:var(--heat);font-weight:600}
.rec{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--brand-soft) 70%,var(--surface)) 0%,var(--surface) 60%)}
.rec-in{padding:22px 24px}
.rec .ttl{font-size:22px;font-weight:600;margin:10px 0 8px}
.rec .why{color:var(--ink2);max-width:62ch}
.rec .impact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rec .impact div{padding:10px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.rec .impact b{display:block;font-size:17px}
.rec .impact span{font-size:11.5px;color:var(--ink3)}
.rec .acts{display:flex;gap:8px;flex-wrap:wrap}
.rec.done{border-color:color-mix(in srgb,var(--ok) 35%,var(--line));background:linear-gradient(160deg,var(--ok-bg),var(--surface) 65%)}
.factor{display:grid;grid-template-columns:130px 1fr 52px;gap:12px;align-items:center;padding:8px 0}
.factor .fb{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;direction:ltr}
.factor .fb div{height:100%;border-radius:4px}
.factor .fv{font-size:12.5px;font-weight:600;text-align:end}
.dev-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dev-row:last-child{border-bottom:0}
.dev-ic{width:36px;height:36px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;flex:none;color:var(--ink2)}
.dev-ic svg{width:18px;height:18px}
.dev-ic.on{background:var(--brand-soft);color:var(--brand)}

/* ---------- Alerts ---------- */
.alert-card{display:grid;grid-template-columns:auto 1fr auto;gap:16px;padding:18px 20px;align-items:start;border-inline-start:4px solid transparent}
.alert-card.crit{border-inline-start-color:var(--crit)}
.alert-card.heat{border-inline-start-color:var(--heat)}
.alert-card.cau{border-inline-start-color:var(--cau)}
.alert-card.info{border-inline-start-color:var(--info)}
.alert-card.resolved{opacity:.72;border-inline-start-color:var(--ok)}
.alert-card .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-top:2px}
.alert-card .rec-line{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert-card .rec-line svg{width:16px;height:16px;color:var(--brand);flex:none;margin-top:2px}
.alert-card .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:130px}
.alert-card.new{animation:alertIn .6s ease}
@keyframes alertIn{from{transform:translateY(-6px);opacity:0}}

/* ---------- Modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(25,20,12,.42);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}}
.modal-h{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-b{padding:16px 24px}
.modal-f{padding:16px 24px 22px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps-list li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px}
.steps-list li .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line2)}
.steps-list li.doing .st{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.steps-list li.done .st{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps-list li.done .st svg{width:13px;height:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.success-mark{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:4px auto 14px}
.success-mark svg{width:32px;height:32px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare > div{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.compare > div.best{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));background:var(--brand-soft)}
.compare dl{display:grid;grid-template-columns:auto auto;gap:6px 12px;margin:10px 0 0;font-size:13px}
.compare dt{color:var(--ink3)} .compare dd{margin:0;font-weight:600;text-align:end}
.toasts{position:fixed;bottom:22px;inset-inline-start:22px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:13.5px;animation:rise .25s ease;max-width:380px}
.toast svg{width:18px;height:18px;flex:none;color:var(--brand)}

/* ---------- Demo guide ---------- */
.guide{position:fixed;bottom:22px;inset-inline-end:22px;z-index:50;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;width:280px;font-size:12.5px}
.guide-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.guide ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.guide li{display:flex;gap:8px;align-items:center;color:var(--ink3)}
.guide li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:10px;flex:none}
.guide li.done{color:var(--ink2)} .guide li.done i{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.guide li.cur{color:var(--ink);font-weight:600} .guide li.cur i{border-color:var(--brand);color:var(--brand)}
.guide.min ol{display:none}
.guide.min{width:auto}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,520px);background:var(--bg)}
.login-art{position:relative;overflow:hidden;background:linear-gradient(170deg,#EFE3CC 0%,#E2CDA6 55%,#C9A673 100%);display:flex;flex-direction:column;justify-content:space-between;padding:44px 48px;color:#2A2216}
:root[data-theme="dark"] .login-art{background:linear-gradient(170deg,#2B2519 0%,#3A2F1E 55%,#5A4527 100%);color:#F1E6D2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login-art{background:linear-gradient(170deg,#2B2519 0%,#3A2F1E 55%,#5A4527 100%);color:#F1E6D2}}
.login-art svg.wind{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.wind path{fill:none;stroke-linecap:round}
.wind .w{stroke-dasharray:180 900;animation:wind 9s linear infinite}
@keyframes wind{from{stroke-dashoffset:1080}to{stroke-dashoffset:0}}
.login-art .lt{position:relative;max-width:30ch}
.login-art .lt h1{font-size:46px;line-height:1.1;font-weight:700}
.login-art .lt p{font-size:16px;margin-top:14px;opacity:.85}
.login-art .lb{position:relative;display:flex;gap:28px;font-size:13px}
.login-art .lb b{display:block;font-size:22px}
.login-form{display:flex;flex-direction:column;justify-content:center;padding:48px 56px;background:var(--surface)}
.login-form form{display:flex;flex-direction:column;gap:16px;max-width:380px;width:100%;margin-inline:auto}
.login-form .row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}

/* ---------- Charts ---------- */
.chart svg{width:100%;height:auto;display:block;direction:ltr;overflow:visible}
.chart text{font-family:inherit;fill:var(--ink3);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.heat-grid{display:grid;gap:3px;direction:ltr}
.heat-grid div{aspect-ratio:1.4/1;border-radius:4px}
.insight{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.insight .ii{width:32px;height:32px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.insight .ii svg{width:16px;height:16px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:14px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.stat b{display:block;font-size:24px;font-weight:600}
.stat span{font-size:12px;color:var(--ink3)}

/* ---------- Automation ---------- */
.sys-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.sys-card{padding:18px;cursor:pointer;transition:border-color .15s}
.sys-card.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sys-card .si{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.sys-card .si svg{width:20px;height:20px}
.flow-strip{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.flow-strip .fs{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.flow-strip .fs span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--bg2);font-size:12px}
.flow-strip .arr{color:var(--ink3)}
[dir=rtl] .flow-strip .arr{transform:scaleX(-1)}
.pending{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.pending:last-child{border-bottom:0}

/* ---------- Pole ---------- */
.pole-art{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}
.pole-art svg{width:100%;height:auto;max-height:420px}
.pole-spec{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pole-spec div{padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.pole-spec b{display:block;font-size:13.5px}
.pole-spec span{font-size:12px;color:var(--ink3)}
.batt{display:inline-flex;align-items:center;gap:6px}
.batt i{width:26px;height:11px;border:1.5px solid var(--ink3);border-radius:3px;position:relative;display:inline-block}
.batt i::after{content:"";position:absolute;top:1px;bottom:1px;left:1px;width:var(--w);border-radius:1px;background:var(--c)}

/* ---------- DS ---------- */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.swatch{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.swatch div{height:58px}
.swatch p{padding:8px 10px;font-size:12px}
.swatch p b{display:block;font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.ia{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ia div{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.ia b{display:block;font-size:13.5px;margin-bottom:4px}
.ia span{font-size:12px;color:var(--ink3)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow span{padding:8px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500}
.flow em{font-style:normal;color:var(--ink3)}
[dir=rtl] .flow em{transform:scaleX(-1);display:inline-block}

.fade-in{animation:fade .3s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}.env-grid{grid-template-columns:repeat(2,1fr)}.sys-cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1080px){.ov-grid,.zd-hero{grid-template-columns:1fr}.shell{--side:76px}.brand-txt,.nav a span.lbl,.nav .count,.side-foot,.nav-sep{display:none}.nav a{justify-content:center}.login{grid-template-columns:1fr}.login-art{min-height:320px}}
@media (max-width:720px){.shell{grid-template-columns:1fr}.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:6px;z-index:40;border-inline-end:0;border-top:1px solid var(--line);padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}.brand{display:none}.nav{flex-direction:row;overflow-x:auto;margin:0;width:100%}.nav a.on::before{display:none}.top{padding:10px 14px;flex-wrap:wrap}.user .n,.user .r,.clock .d{display:none}.page{padding:16px 14px 120px}.kpis{grid-template-columns:repeat(2,1fr)}.stat-row{grid-template-columns:repeat(2,1fr)}.pole-art{grid-template-columns:1fr}.guide{display:none}.alert-card{grid-template-columns:auto 1fr}.alert-card .acts{grid-column:1/-1;flex-direction:row}.rec .impact{grid-template-columns:1fr}.login-form{padding:32px 22px}}

/* =========================================================
   v2 — operations review additions
   ========================================================= */
.anchor{scroll-margin-top:84px}
td.num,th.num{display:table-cell}
.role-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.role-pick button{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface);text-align:start;transition:border-color .15s,background .15s}
.role-pick button:hover{border-color:var(--ink3)}
.role-pick button.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.role-pick .ri{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.role-pick .ri svg{width:17px;height:17px}
.role-pick b{font-size:13.5px}
.role-pick small{font-size:11.5px;color:var(--ink3);line-height:1.4}
.role-sum{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.6}
.task-card{padding:18px 20px}
@media (max-width:460px){.role-pick{grid-template-columns:1fr}}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s}
.kpi.click:hover{border-color:var(--line2);transform:translateY(-1px)}
.kpi .k-go{position:absolute;top:15px;inset-inline-end:14px;color:var(--ink3);width:15px;height:15px;opacity:.7}
[dir=rtl] .kpi .k-go{transform:scaleX(-1)}
.kpi .k-val small{font-size:17px;color:var(--ink3);font-weight:500}
.kpi .k-label{padding-inline-end:18px}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;cursor:pointer}
.link svg{width:14px;height:14px}
[dir=rtl] .link svg.fl,[dir=rtl] .fl{transform:scaleX(-1)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-head p{margin-top:2px}

/* legend with counts */
.legend-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.legend-st .li{padding:8px 11px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;gap:1px;font-size:11.5px}
.legend-st .li b{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.legend-st .li b i{width:10px;height:10px;border-radius:3px;flex:none}
.legend-st .li .c{font-size:19px;font-weight:600;line-height:1.15}
.legend-st .li .c small{font-size:11px;font-weight:500;color:var(--ink3)}

/* map selected state */
.zone-shape.dim{opacity:.42}
.zone-shape.sel{stroke-width:3.2}

/* zone summary building blocks */
.desc-box{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--ink2);line-height:1.6}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.mini-stats div{padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);min-width:0}
.mini-stats b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.mini-stats b small{font-size:11.5px;color:var(--ink3);font-weight:500}
.mini-stats span{font-size:11px;color:var(--ink3);display:block;line-height:1.35}
.clim{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.clim > div{padding:8px 10px;border-radius:10px;border:1px dashed var(--line2);display:flex;flex-direction:column;min-width:0}
.clim .cl{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:4px;line-height:1.3}
.clim .cl svg{width:13px;height:13px;flex:none}
.clim .cv{font-weight:600;font-size:14.5px}
.clim .cv small{font-size:11px;color:var(--ink3);font-weight:500}
.clim .cv.flag{color:var(--heat)}
.clim.lg .cv{font-size:22px}
.clim.lg > div{padding:12px 14px}
.sub-lbl{font-size:11.5px;font-weight:600;color:var(--ink3);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sub-lbl svg{width:14px;height:14px}
.sub-lbl em{font-style:normal;font-weight:500;margin-inline-start:auto}
.sys-chips{display:flex;flex-wrap:wrap;gap:6px}
.sys-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink2)}
.sys-chip svg{width:14px;height:14px}
.sys-chip.on{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));background:var(--brand-soft);color:var(--brand)}
.sys-chip.fault{border-color:color-mix(in srgb,var(--crit) 40%,var(--line));background:var(--crit-bg);color:var(--crit)}
.sys-chip.pend{border-color:color-mix(in srgb,var(--cau) 40%,var(--line));background:var(--cau-bg);color:var(--cau)}
.note{font-size:12px;color:var(--ink3);display:flex;gap:6px;align-items:flex-start}
.note svg{width:14px;height:14px;flex:none;margin-top:2px}

/* decisions / alerts */
.unread{width:8px;height:8px;border-radius:50%;background:var(--info);flex:none;display:inline-block}
.dec-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);align-items:start;cursor:pointer;transition:background .12s}
.dec-row:hover{background:var(--surface2)}
.dec-row:last-child{border-bottom:0}
.dec-row .tt{font-weight:600}
.dec-row.read .tt{font-weight:500;color:var(--ink2)}
.iv{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid;white-space:nowrap}
.iv svg{width:12px;height:12px}
.iv-maint{color:var(--heat);border-color:color-mix(in srgb,var(--heat) 30%,transparent);background:var(--heat-bg)}
.iv-ops{color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent);background:var(--info-bg)}
.iv-auto{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 30%,transparent);background:var(--brand-soft)}
.alert-card.focus{box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;font-size:13px;margin:0}
.kv dt{color:var(--ink3);font-size:12.5px}
.kv dd{margin:0}
.filter-row{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-row .fl-lbl{font-size:12px;color:var(--ink3);font-weight:600}

/* events */
.ev-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ev-card{padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:9px;border-inline-start:4px solid var(--line);transition:border-color .15s,transform .12s}
.ev-card:hover{transform:translateY(-1px)}
.ev-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.ev-row:hover{background:var(--surface2)}
.ev-row:last-child{border-bottom:0}

/* top-bar menus */
.rel{position:relative}
.pop-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:45;width:300px;max-height:min(560px,calc(100vh - 90px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 50px -18px rgba(0,0,0,.35);animation:popd .16s ease}
@keyframes popd{from{opacity:0;transform:translateY(-4px)}}
.pop-menu .mh{padding:14px 16px;border-bottom:1px solid var(--line)}
.pop-menu .mi{display:flex;align-items:center;gap:10px;padding:11px 16px;width:100%;border:0;background:none;text-align:start;font-size:13.5px;color:var(--ink)}
.pop-menu .mi:hover{background:var(--surface2)}
.pop-menu .mi svg{width:17px;height:17px;color:var(--ink3);flex:none}
.pop-menu .mi small{display:block;color:var(--ink3);font-size:11.5px}
.pop-menu .dec-row{padding:12px 16px}
.user{border:0;background:none;cursor:pointer;transition:background .15s;text-align:start}
.user:hover,.user.open{background:var(--surface)}
.sys{cursor:pointer}
.sys:hover{border-color:var(--line2)}
.sys.paused{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 30%,transparent);color:var(--crit)}
.avatar.sm{width:32px;height:32px;font-size:13px}
.avatar.lg{width:64px;height:64px;font-size:24px}
.avatar.av-admin{background:linear-gradient(135deg,var(--sand),var(--sand-deep))}
.avatar.av-ops{background:linear-gradient(135deg,#6BA9CF,#2F6C8F)}
.avatar.av-maint{background:linear-gradient(135deg,#EE8A4A,#B95418)}
.member{display:flex;align-items:center;gap:10px;min-width:0}
.member .mn{font-weight:600;line-height:1.25}
.member .mt{font-size:11.5px;color:var(--ink3);line-height:1.3}
.nav .count.soft{background:var(--bg2);color:var(--ink2)}

/* automation */
.auto-bar{display:flex;align-items:center;gap:16px;padding:16px 20px;flex-wrap:wrap;margin-bottom:18px}
.auto-bar.paused{border-color:color-mix(in srgb,var(--crit) 40%,var(--line));background:linear-gradient(160deg,var(--crit-bg),var(--surface) 70%)}
.sys-card .cnt{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
textarea.input{min-height:86px;resize:vertical;line-height:1.55}
.modal.wide{width:min(720px,100%)}
.check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check-list label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px;background:var(--surface2)}
.check-list input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt label{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.fmt label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.fmt input{accent-color:var(--brand)}
.fmt .fi{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.hint-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .txt{line-height:1.35}
.set-row .txt small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.perm{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--bg2);color:var(--ink2);margin:2px}
.vbars{display:grid;gap:6px;align-items:end;direction:ltr}
.vbars .vb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vbars .vb div{width:62%;border-radius:4px 4px 0 0}
.vbars .vb span{font-size:10.5px;color:var(--ink3)}
.split-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;direction:ltr}

@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1080px){.nav .count.soft{display:none}}
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legend-st,.mini-stats,.clim,.check-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid,.fmt{grid-template-columns:1fr}
  .pop-menu{position:fixed;top:64px;inset-inline:12px;width:auto!important}
  .sys .lbl{display:none}
  .dec-row{grid-template-columns:auto minmax(0,1fr)}
  .dec-row > .btn{grid-column:1/-1}
  .ev-row{grid-template-columns:46px minmax(0,1fr)}
  .ev-row > :last-child{grid-column:2}
}
</style>

  return {sys:['fans'],title:{ar:'تشغيل المراوح الذكية',en:'Start Smart Fans'},

    drop:3.2,conf:86,water:0};

function factorsFor(z){
  const f=[
    {k:'fSolar',v:Math.max(0,(z.solar-400)/80),c:'var(--heat)'},
    {k:'fWind',v:Math.max(0,(3.2-z.wind)*1.4),c:'var(--cau)'},

    {k:'fHum',v:Math.max(0,(z.hum-30)*.05),c:'var(--info)'},

/* ---------------- Charts (inline SVG) ---------------- */
function lineChart({series,labels,yMin,yMax,h=230,w=640,thresh,forecastFrom,yUnit='°'}){
  const pl=34,pr=10,pt=12,pb=26, iw=w-pl-pr, ih=h-pt-pb;
  const x=i=>pl+i*(iw/(labels.length-1)), y=v=>pt+ih-(v-yMin)/(yMax-yMin)*ih;
  let g='';
  const ticks=5;
  for(let i=0;i<=ticks;i++){const v=yMin+(yMax-yMin)*i/ticks;g+=`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}${yUnit}</text>`}
  labels.forEach((l,i)=>{if(l!=='')g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`});
  if(thresh) g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(thresh.v)}" y2="${y(thresh.v)}" stroke="var(--crit)" stroke-dasharray="4 4" stroke-width="1.2" opacity=".7"/>`;
  if(forecastFrom!=null) g+=`<rect x="${x(forecastFrom)}" y="${pt}" width="${w-pr-x(forecastFrom)}" height="${ih}" fill="var(--sand-soft)" opacity=".6"/><text x="${x(forecastFrom)+6}" y="${pt+12}" style="fill:var(--sand-deep);font-weight:600">${t('predicted')}</text>`;
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>v==null?null:[x(i),y(v)]);
    let d='',fd='';
    pts.forEach((p,i)=>{if(!p)return; if(forecastFrom!=null&&i>forecastFrom){fd+=(fd?'L':'M')+p.join(',')} else {d+=(d?'L':'M')+p.join(',')}
      if(forecastFrom!=null&&i===forecastFrom) fd='M'+p.join(',')});
    if(s.area){const first=pts.findIndex(p=>p),lastI=forecastFrom??pts.length-1;g+=`<path d="${d}L${x(lastI)},${pt+ih}L${x(first)},${pt+ih}Z" fill="${s.color}" opacity=".09"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(fd) g+=`<path d="${fd}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-dasharray="5 5" stroke-linecap="round"/>`;
    if(s.dotAt!=null){const p=pts[s.dotAt];g+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5"/>`}
  });
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`;
}
function hBars(items,max,unit=''){
  return items.map(it=>`<div class="factor" style="grid-template-columns:150px 1fr 56px"><span class="sm">${it.label}</span><div class="fb"><div style="width:${it.v/max*100}%;background:${it.c}"></div></div><span class="fv num">${it.v}${unit}</span></div>`).join('');
}
function legendRow(items){return `<div class="legend">${items.map(i=>`<span><i style="background:${i.c}"></i>${i.l}</span>`).join('')}</div>`}

/* ---------------- Map ---------------- */
const CX=400,CY=400;
const pol=(r,a)=>[CX+r*Math.cos(a),CY+r*Math.sin(a)];
function sector(r0,r1,a0,a1){
  const large=(a1-a0)>Math.PI?1:0, p1=pol(r1,a0),p2=pol(r1,a1),p3=pol(r0,a1),p4=pol(r0,a0);
  return `M${p1}A${r1},${r1} 0 ${large} 1 ${p2}L${p3}A${r0},${r0} 0 ${large} 0 ${p4}Z`;
}
const GEO={};
(function(){
  GEO.A={type:'c',r:92,mid:[CX,CY],ang:0};
  const inner=S.zones.slice(1,8), outer=S.zones.slice(8);
  const g1=.035,g2=.025;
  inner.forEach((z,i)=>{const n=7,a0=-Math.PI/2+i*2*Math.PI/n+g1,a1=-Math.PI/2+(i+1)*2*Math.PI/n-g1;GEO[z.id]={type:'s',r0:108,r1:218,a0,a1,mid:pol(163,(a0+a1)/2),ang:(a0+a1)/2}});
  outer.forEach((z,i)=>{const n=16,off=-Math.PI/2-Math.PI/16,a0=off+i*2*Math.PI/n+g2,a1=off+(i+1)*2*Math.PI/n-g2;GEO[z.id]={type:'s',r0:234,r1:352,a0,a1,mid:pol(293,(a0+a1)/2),ang:(a0+a1)/2}});
})();
function polePos(p){
  const g=GEO[p.zone];
  if(g.type==='c') return p.k?[CX+38,CY+34]:[CX-40,CY-30];
  const a=g.a0+(g.a1-g.a0)*(p.k?0.78:0.22), r=g.r0+(g.r1-g.r0)*(p.k?0.75:0.3);
  return pol(r,a);
}
const zoneShape=g=>g.type==='c'?`<circle cx="${CX}" cy="${CY}" r="${g.r}"`:`<path d="${sector(g.r0,g.r1,g.a0,g.a1)}"`;
function renderMap({full=false,sel=null,dimOthers=false}={}){
  const ly=full?S.layers:{zones:true,poles:true,events:false,shade:false,mist:true};
  let s=`<svg viewBox="0 0 800 800" aria-label="${t('expoMap')}"><defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--ink2)" stroke-width="1.6" opacity=".45"/></pattern>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="var(--surface)"/><stop offset="1" stop-color="var(--sand-soft)"/></radialGradient>
  </defs>`;
  s+=`<circle cx="400" cy="400" r="392" fill="url(#ground)" stroke="var(--line2)"/>`;
  for(let i=0;i<9;i++){const yy=90+i*72;s+=`<path d="M40,${yy} C200,${yy-36} 300,${yy+30} 420,${yy-6} S640,${yy-30} 770,${yy+8}" fill="none" stroke="var(--sand)" stroke-width="1" opacity=".55" clip-path="circle(392px at 400px 400px)"/>`}
  s+=`<circle cx="400" cy="400" r="226" fill="none" stroke="var(--line2)" stroke-width="5" opacity=".6"/>`;
  s+=`<circle cx="400" cy="400" r="370" fill="none" stroke="var(--line2)" stroke-width="2" stroke-dasharray="2 6"/>`;
  if(ly.zones){
    S.zones.forEach(z=>{
      const g=GEO[z.id], st=stOf(z.utci), isSel=sel===z.id, dim=dimOthers&&sel&&!isSel;
      const fill=`color-mix(in srgb,var(--${st}) ${isSel?62:st==='ok'?18:28}%,var(--surface))`;
      const shape=zoneShape(g);
      s+=`<g data-act="zone" data-id="${z.id}" role="button" tabindex="0" aria-label="${zfull(z)}" aria-pressed="${isSel}">`;
      s+=`${shape} class="zone-shape${isSel?' sel':''}${dim?' dim':''}" fill="${fill}" stroke="var(--${st})" stroke-width="${isSel?3.2:1.6}"/>`;
      if(st==='crit'&&!isSel) s+=`${shape} class="crit-pulse" fill="var(--crit)" opacity=".3" pointer-events="none"/>`;
      if(S.flash===z.id) s+=`${shape} class="flash-ring" fill="none" stroke="var(--ok)" pointer-events="none"/>`;
      s+=`</g>`;
    });
    // selected outline drawn on top so it is never hidden by neighbours
    if(sel&&GEO[sel]){const g=GEO[sel];const sh=zoneShape(g);
      s+=`${sh} fill="none" stroke="var(--surface)" stroke-width="9" pointer-events="none"/>${sh} fill="none" stroke="var(--ink)" stroke-width="4.5" pointer-events="none"/>`;}
    S.zones.forEach(z=>{const g=GEO[z.id],st=stOf(z.utci),isSel=sel===z.id,[mx,my]=g.mid,dim=dimOthers&&sel&&!isSel;
      s+=`<g pointer-events="none" opacity="${dim?.55:1}"><text class="zone-label" x="${mx}" y="${my-2}" text-anchor="middle" font-size="${g.type==='c'?26:isSel?21:18}" fill="var(--ink)">${z.id}</text>`;
      s+=`<text class="zone-label" x="${mx}" y="${my+(g.type==='c'?20:15)}" text-anchor="middle" font-size="${g.type==='c'?14:11.5}" fill="${isSel?'var(--ink)':`var(--${st})`}">${z.utci.toFixed(1)}°</text></g>`;
    });
  }
  if(ly.shade){
    ['U','J','E','A','L','G'].forEach(id=>{const g=GEO[id];
      if(g.type==='c'){s+=`<circle cx="${CX}" cy="${CY}" r="${g.r-12}" fill="url(#hatch)" pointer-events="none" opacity=".5"/>`;return}
      const a0=g.a0+(g.a1-g.a0)*.1,a1=g.a1-(g.a1-g.a0)*.1;s+=`<path d="${sector(g.r1-30,g.r1-8,a0,a1)}" fill="url(#hatch)" pointer-events="none"/>`});
  }
  if(ly.mist){
    S.zones.forEach(z=>{
      const on = S.devices.some(d=>d.zone===z.id&&(d.sys==='misting'||d.sys==='coolingSys')&&d.status==='on');
      const g=GEO[z.id]; if(!on && !full) return;
      if(!on && !['E','B','G','N'].includes(z.id)) return;
      const [mx,my]= g.type==='c'?[CX+44,CY-44]:pol(g.r0+16,(g.a0+g.a1)/2);
      s+=`<g pointer-events="none"><circle cx="${mx}" cy="${my}" r="11" fill="var(--info-bg)" stroke="var(--info)" stroke-width="1.5" ${on?'':'stroke-dasharray="3 3"'}/>`;
      for(let k=0;k<3;k++) s+=`<circle cx="${mx-4+k*4}" cy="${my-2+(k%2)*4}" r="1.6" fill="var(--info)"/>`;
      s+=`</g>`;
    });
  }
  if(ly.events){
    S.events.forEach(e=>{const g=GEO[e.zone];const [mx,my]=g.type==='c'?[CX,CY-58]:pol(g.r1-14,g.a0+(g.a1-g.a0)*.5);
      const n=evNeed(e), c=n==='need'?'var(--crit)':n==='watch'?'var(--cau)':'var(--brand)';
      s+=`<g data-act="evmark" data-id="${e.id}" style="cursor:pointer"><rect x="${mx-11}" y="${my-11}" width="22" height="22" rx="6" fill="var(--surface)" stroke="${c}" stroke-width="2"/><path d="M${mx-5},${my-1}h10M${mx-5},${my+3}h6" stroke="${c}" stroke-width="2" stroke-linecap="round"/><title>${L(e.name)} · ${e.time}</title></g>`});
  }
  if(ly.poles){
    S.sensors.forEach(p=>{
      const [px,py]=polePos(p); const c=p.status==='online'?'var(--ok)':p.status==='warning'?'var(--cau)':'var(--ink3)';
      s+=`<g class="pole" data-act="pole" data-id="${p.id}" role="button" tabindex="0" aria-label="${p.id}">`;
      if(p.status!=='offline') s+=`<circle class="ring" cx="${px}" cy="${py}" r="5" fill="none" stroke="${c}" stroke-width="1.5" style="animation-delay:${(parseInt(p.id.slice(4))%7)*.3}s"/>`;
      s+=`<circle cx="${px}" cy="${py}" r="${full?6:4.5}" fill="var(--surface)" stroke="${c}" stroke-width="2.4"/><circle cx="${px}" cy="${py}" r="${full?2.2:1.6}" fill="${c}"/></g>`;
    });
  }
  [['N',400,18],['E',782,400],['S',400,786],['W',18,400]].forEach(([l,x,y])=>s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="var(--ink3)">${l}</text>`);
  s+='</svg>';
  let pop='';
  if(S.popPole){const p=S.sensors.find(x=>x.id===S.popPole);const [px,py]=polePos(p);
    pop=`<div class="map-pop" style="left:${px/8}%;top:${py/8}%"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>${A('عمود استشعار','Sensor pole')} <span class="num">${p.id}</span></b>${sensBadge(p.status)}</div>
    <div class="faint" style="margin-top:2px">${zfull(Z(p.zone))}</div>
    <div class="rows"><span>${t('temp')}</span><span class="num">${p.temp}°C</span><span>${t('hum')}</span><span class="num">${p.hum}%</span><span>${t('wind')}</span><span class="num">${p.wind} m/s</span><span>${t('solar')}</span><span class="num">${p.solar} W/m²</span><span>${t('s_batt')}</span><span class="num">${p.batt}%</span><span>${t('lastUpd')}</span><span>${agoStr(p.last)}</span></div></div>`}
  return `<div class="map-wrap" id="map">${s}${pop}</div>`;
}

      ${als.map(a=>`<div class="dev-row" style="padding:13px 20px"><div class="sev ${a.sev}">${aIcon(a)}</div><div style="flex:1;min-width:0"><b>${L(a.title)}</b><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px">${ivTag(a.iv)}<span class="faint" style="font-size:11.5px">${A('رُصدت','Detected')} <span class="num">${a.time}</span></span>${a.target?`<span class="faint" style="font-size:11.5px">${targetLabel(a.target)}</span>`:''}</div></div>${a.status==='active'?`<button class="btn btn-ghost btn-sm" data-act="alertdo" data-id="${a.id}">${ivActLabel(a)}</button>`:`<span class="badge b-info">${t('inProgress')}</span>`}</div>`).join('')}
      ${tks.map(x=>`<div class="dev-row" style="padding:13px 20px;cursor:pointer" data-act="goto" data-to="maintenance"><div class="dev-ic">${I.task}</div><div style="flex:1;min-width:0"><b class="num">${x.id}</b> · ${L(TTYPE[x.type][0])}<div class="faint sm">${targetLabel(x.target)} · ${L(MB(x.who).name)} · ${A('الموعد','Due')} <span class="num">${x.due}</span></div></div>${tStatBadge(x.status)}</div>`).join('')}
      ${!als.length&&!tks.length?`<div class="empty">${A('لا توجد مشكلات أو مهام مفتوحة.','No open issues or tasks.')}</div>`:''}</div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);margin-top:18px">
    <div class="card"><div class="card-head"><div><h3>${t('whyTitle')}</h3><p>${t('whySub')}</p></div></div><div style="padding:12px 20px 18px">
      ${fac.map(f=>`<div class="factor"><span class="sm">${t(f.k)}</span><div class="fb"><div style="width:${f.v/maxF*100}%;background:${f.c}"></div></div><span class="fv num">+${f.v}°</span></div>`).join('')}
      ${!z.mitigated&&st!=='ok'?`<div class="factor"><span class="sm">${t('fShade')}</span><div class="fb"><div style="width:${2.4/maxF*100}%;background:var(--ink3)"></div></div><span class="fv num">+2.4°</span></div>`:''}
    </div></div>
    <div class="card"><div class="card-head"><div><h3>${t('trend12')}</h3><p>${zfull(z)}</p></div>${legendRow([{c:`var(--${st})`,l:t('actual')+' / '+t('predicted')},{c:'var(--crit)',l:t('threshold')}])}</div>
      <div style="padding:14px 20px 16px">${lineChart({series:[{data:series,color:`var(--${st})`,area:true,dotAt:6}],labels:hrs.map(h=>h),yMin:24,yMax:48,h:210,forecastFrom:6,thresh:{v:38}})}</div></div>
  </div>`;
}

/* ---------------- Alerts & decisions ---------------- */
function pageAlerts(){
  const f=S.alertFilter, iv=S.alertIv;
  const list=S.alerts.filter(a=>(f==='all'||a.status===f)&&(iv==='all'||a.iv===iv)).sort((a,b)=>(a.status==='resolved')-(b.status==='resolved')||tmin(b.time)-tmin(a.time));
  const n=k=>S.alerts.filter(a=>k==='all'||a.status===k).length, ni=k=>S.alerts.filter(a=>k==='all'||a.iv===k).length;
  return `<div class="page-head"><div><h1>${A('التنبيهات والقرارات','Alerts & decisions')}</h1><p class="muted">${A('كل تنبيه يوضّح نوع المشكلة، المنطقة المتأثرة، الوصف، ونوع التدخل المطلوب.','Every alert shows the problem, the affected zone, a description and the kind of action needed.')}</p></div>${unreadN()?`<button class="btn btn-ghost btn-sm" data-act="readAll">${I.check} ${A('تعليم الكل كمقروء','Mark all read')} <span class="num">(${unreadN()})</span></button>`:''}</div>
  <div class="filter-row"><span class="fl-lbl">${t('status')}</span><div class="chips">${[['all','all'],['active','active'],['progress','inProgress'],['resolved','resolved']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="afilter" data-k="${k}">${t(l)} <span class="num">${n(k)}</span></button>`).join('')}</div>
    <span class="fl-lbl">${A('نوع التدخل','Action type')}</span><div class="chips">${['all','auto','ops','maint'].map(k=>`<button class="chip ${iv===k?'on':''}" data-act="aiv" data-k="${k}">${k==='all'?t('all'):L(IV[k])} <span class="num">${ni(k)}</span></button>`).join('')}</div></div>
  <div class="grid" style="gap:12px">${list.map(a=>{
    const z=Z(a.zone), sevCls=a.status==='resolved'?'resolved':a.sev, task=a.task&&S.tasks.find(x=>x.id===a.task);
    const stB=a.status==='active'?`<span class="badge b-crit"><span class="dot"></span>${t('active')}</span>`:a.status==='progress'?`<span class="badge b-info"><span class="dot"></span>${t('inProgress')}</span>`:`<span class="badge b-ok"><span class="dot"></span>${t('resolved')}</span>`;
    let acts='';
    if(a.status==='active'){acts=`<button class="btn btn-primary btn-sm" data-act="alertdo" data-id="${a.id}">${ivActLabel(a)}</button>`;
      if(a.type==='event') acts+=`<button class="btn btn-ghost btn-sm" data-act="newtask" data-zone="${a.zone}" data-type="ops" data-alert="${a.id}">${A('إسناد مهمة','Assign task')}</button>`;
      if(a.iv==='maint'&&a.type==='device') acts+=`<button class="btn btn-ghost btn-sm" data-act="goto" data-to="automation">${t('automation')}</button>`;
      if(a.type==='sensor') acts+=`<button class="btn btn-ghost btn-sm" data-act="goto" data-to="sensors">${t('sensors')}</button>`;
      acts+=`<button class="btn btn-ghost btn-sm" data-act="openzone" data-id="${a.zone}">${t('viewZone')}</button>`;}
    else acts=`${task?`<button class="btn btn-ghost btn-sm" data-act="goto" data-to="maintenance">${A('عرض المهمة','View task')}</button>`:''}<button class="btn btn-ghost btn-sm" data-act="openzone" data-id="${a.zone}">${t('viewZone')}</button>`;
    if(!a.read) acts+=`<button class="btn btn-text btn-sm" data-act="markread" data-id="${a.id}">${A('تعليم كمقروء','Mark read')}</button>`;
    return `<div class="card alert-card ${sevCls} ${S.alertFocus===a.id?'focus':''} anchor" id="al-${a.id}"><div class="sev ${a.status==='resolved'?'ok':a.sev}">${aIcon(a)}</div>
      <div style="min-width:0"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>${L(a.title)}</h3>${stB}${a.read?`<span class="faint sm">${ic(I.check,13)} ${A('مقروء','Read')}</span>`:`<span class="badge b-info"><span class="unread"></span>${A('غير مقروء','Unread')}</span>`}</div>
      <dl class="kv" style="margin-top:12px">
        <dt>${A('نوع المشكلة','Problem type')}</dt><dd>${L(ATYPE[a.type])} · <span class="badge b-${a.sev}" style="padding:1px 8px">${t('sev_'+a.sev)}</span></dd>
        <dt>${A('المنطقة المتأثرة','Affected zone')}</dt><dd>${zfull(z)}${a.target?` · ${targetLabel(a.target)}`:''}${a.type==='heat'?` · UTCI <b class="num" style="color:var(--${stOf(z.utci)})">${z.utci.toFixed(1)}°</b>`:''}</dd>
        <dt>${A('الوصف','Description')}</dt><dd>${L(a.problem)}</dd>
        <dt>${A('التدخل المطلوب','Action needed')}</dt><dd>${ivTag(a.iv)} <span class="muted sm">${L(IVD[a.iv])}</span></dd>
        <dt>${A('التوقيت','Timing')}</dt><dd class="sm">${A('رُصدت المشكلة','Issue detected')} <b class="num">${a.time}</b> <span class="faint">(${agoMin(a.time)})</span> · ${A('أُرسل التنبيه','Alert sent')} <b class="num">${a.sent||a.time}</b></dd>
        ${task?`<dt>${A('المهمة المرتبطة','Linked task')}</dt><dd class="sm"><b class="num">${task.id}</b> · ${L(MB(task.who).name)} · ${tStatBadge(task.status)}</dd>`:''}
      </dl>
      <div class="rec-line">${I.spark}<span><b>${t('recommended')}:</b> ${L(a.rec)}</span></div></div>
      <div class="acts">${acts}</div></div>`}).join('')||`<div class="card empty">${A('لا توجد تنبيهات مطابقة','No matching alerts')}</div>`}</div>`;
}

const riskBadge = r => `<span class="badge ${r==='low'?'b-ok':r==='mod'?'b-cau':r==='high'?'b-heat':'b-crit'}"><span class="dot"></span>${t('risk_'+r)}</span>`;

/* ---------------- Automation ---------------- */
const DEVEV={on:{ar:'تشغيل',en:'Turned on'},off:{ar:'إيقاف',en:'Turned off'},fault:{ar:'عطل مسجّل',en:'Fault recorded'},manual:{ar:'تحويل إلى تحكم يدوي',en:'Switched to manual'},auto:{ar:'تحويل إلى الوضع التلقائي',en:'Switched to automatic'},pending:{ar:'القاعدة تحققت — بانتظار الاعتماد',en:'Rule triggered — awaiting approval'}};
const devEvColor=e=>e==='on'?'var(--ok)':e==='fault'?'var(--crit)':e==='pending'?'var(--cau)':e==='manual'||e==='auto'?'var(--info)':'var(--ink3)';
function devLogList(entries,showDev=true){
  return `<ul class="log">${entries.map(l=>{const d=D(l.id);return `<li><span class="lt num">${l.t}</span><span class="ld" style="background:${devEvColor(l.ev)}"></span><span class="lx">${showDev?`<b class="num">${d.code}</b> — `:''}${L(DEVEV[l.ev])}<small>${showDev?zn(d.zone)+' · ':''}${L(l.src)}</small></span></li>`}).join('')||`<li class="faint">—</li>`}</ul>`;
}
const SYSD={misting:{ar:'رشاشات رذاذ تخفض حرارة الهواء حول الزوار. تستهلك مياه.',en:'Misting lowers air temperature around visitors. Uses water.'},shading:{ar:'مظلات متحركة تقطع الإشعاع الشمسي المباشر.',en:'Retractable shades block direct solar radiation.'},coolingSys:{ar:'وحدات تبريد للمساحات شبه المغلقة ونقاط الانتظار.',en:'Cooling units for semi-enclosed spaces and queues.'},fans:{ar:'مراوح ذكية تزيد حركة الهواء دون استهلاك مياه.',en:'Smart fans boost airflow without using water.'}};
function pageAutomation(){
  const cat=S.autoTab;
  const pend=[...S.devices.filter(d=>d.status==='pending').map(d=>({kind:'rule',d})),
    ...S.zones.filter(z=>stOf(z.utci)==='crit'&&!z.mitigated&&!S.devices.some(d=>d.zone===z.id&&d.status==='on')).map(z=>({kind:'ai',z}))];
  const list=S.devices.filter(d=>d.sys===cat);
  const running=S.devices.filter(d=>d.status==='on').length, autoN=S.devices.filter(d=>d.mode==='auto').length, manN=S.devices.length-autoN;
  const hist=S.devLog.filter(l=>D(l.id).sys===cat).sort((a,b)=>tmin(b.t)-tmin(a.t)||b.n-a.n).slice(0,12);
  return `<div class="page-head"><div><h1>${t('automation')}</h1><p class="muted">${A('الأجهزة مقسّمة حسب النوع — اختر فئة لعرض أجهزتها فقط.','Devices are grouped by type — pick a category to see only its devices.')}</p></div></div>
  <div class="card auto-bar ${S.autoPaused?'paused':''}">
    <div class="dev-ic ${S.autoPaused?'':'on'}" style="width:46px;height:46px;${S.autoPaused?'background:var(--crit-bg);color:var(--crit)':''}">${S.autoPaused?I.stop:I.auto}</div>
    <div style="flex:1;min-width:220px"><b style="font-size:15.5px">${S.autoPaused?A('الأتمتة موقوفة — جميع الأجهزة تحت التحكم اليدوي','Automation paused — all devices under manual control'):A('الأتمتة تعمل','Automation is running')}</b>
      <div class="sm muted"><span class="num">${autoN}</span> ${A('جهاز في الوضع التلقائي','in automatic mode')} · <span class="num">${manN}</span> ${A('في التحكم اليدوي','in manual control')} · <span class="num">${running}</span> ${A('يعمل الآن','running now')}</div>
      <div class="faint sm" style="margin-top:2px">${S.autoPaused?A('لن تُنفَّذ أي قاعدة تلقائية حتى الاستئناف. يمكنك تشغيل الأجهزة وإيقافها يدويًا من الجدول.','No automatic rule will run until you resume. Turn devices on/off manually below.'):A('عند حدوث خلل في نظام يعمل تلقائيًا، أوقف الأتمتة وانتقل إلى التحكم اليدوي.','If an automated system misbehaves, stop automation and switch to manual control.')}</div></div>
    ${S.autoPaused?`<button class="btn btn-primary btn-lg" data-act="autoResume">${ic(I.play,17,'')} ${A('استئناف الأتمتة','Resume automation')}</button>`:`<button class="btn btn-danger btn-lg" data-act="autoStop">${ic(I.stop,17,'')} ${A('إيقاف الأتمتة','Stop automation')}</button>`}
  </div>
  ${pend.length?`<div class="card" style="margin-bottom:18px;border-color:color-mix(in srgb,var(--cau) 40%,var(--line))"><div class="card-head"><div><h3>${t('pendingTitle')} <span class="num faint">(${pend.length})</span></h3><p>${t('pendingSub')}</p></div></div>
  ${pend.map(p=>p.kind==='rule'?`<div class="pending"><div class="dev-ic">${SYSI[p.d.sys]}</div><div style="flex:1"><b>${t(p.d.sys)} <span class="num faint">${p.d.code}</span> — ${zn(p.d.zone)}</b><div class="sm muted">${A('تحققت القاعدة','Rule triggered')}: UTCI ${Z(p.d.zone).utci.toFixed(1)}° > ${p.d.th}° · ${L(p.d.last)}</div></div><button class="btn btn-ghost btn-sm" data-act="reject" data-id="${p.d.id}">${t('reject')}</button><button class="btn btn-primary btn-sm" data-act="approveDev" data-id="${p.d.id}">${t('approveBtn')}</button></div>`
   :`<div class="pending"><div class="dev-ic" style="background:var(--brand-soft);color:var(--brand)">${I.spark}</div><div style="flex:1"><b>${L(recFor(p.z).title)} — ${zn(p.z.id)}</b><div class="sm muted">${t('recTitle')} · UTCI ${p.z.utci.toFixed(1)}° · ${t('confidence')} ${recFor(p.z).conf}%</div></div><button class="btn btn-ghost btn-sm" data-act="openzone" data-id="${p.z.id}">${t('viewZone')}</button><button class="btn btn-primary btn-sm" data-act="activate" data-id="${p.z.id}">${t('approveBtn')}</button></div>`).join('')}</div>`:''}
  <div class="sys-cards" role="tablist">${SYS.map(s=>{const ds=S.devices.filter(d=>d.sys===s),on=ds.filter(d=>d.status==='on').length,fl=ds.filter(d=>d.status==='fault').length,pd=ds.filter(d=>d.status==='pending').length;return `<div class="card sys-card ${cat===s?'on':''}" data-act="autoTab" data-k="${s}" role="tab" aria-selected="${cat===s}" tabindex="0"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="si">${SYSI[s]}</div><span class="faint sm">${s==='misting'?'<span class="num">'+on*120+'</span> L/h':s==='fans'||s==='coolingSys'?'<span class="num">'+(on*4.2).toFixed(1)+'</span> kW':''}</span></div><h3 style="margin-top:12px">${t(s)}</h3><div class="muted sm"><b class="num" style="color:var(--ink);font-size:18px">${on}</b> / <span class="num">${ds.length}</span> ${t('activeUnits')}</div><div class="cnt">${fl?`<span class="badge b-crit" style="padding:1px 8px">${fl} ${A('عطل','fault')}</span>`:''}${pd?`<span class="badge b-cau" style="padding:1px 8px">${pd} ${A('بانتظار','pending')}</span>`:''}</div></div>`}).join('')}</div>
  <div class="card scroll-x"><div class="card-head"><div><h3>${A('أجهزة','Devices —')} ${t(cat)} <span class="faint num">(${list.length})</span></h3><p>${L(SYSD[cat])}</p></div></div>
  <table class="tbl"><thead><tr><th>${A('الجهاز','Device')}</th><th>${t('d_zone')}</th><th>${t('d_status')}</th><th>${A('وضع التحكم','Control mode')}</th><th>${t('d_trigger')}</th><th>${t('d_last')}</th><th></th></tr></thead><tbody>
  ${list.map(d=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="dev-ic ${d.status==='on'?'on':''}" style="width:30px;height:30px;${d.status==='fault'?'background:var(--crit-bg);color:var(--crit)':''}">${SYSI[d.sys]}</div><div><b class="num">${d.code}</b><div class="faint" style="font-size:11.5px">${t(d.sys)}</div></div></div></td><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="dot" style="background:var(--${stOf(Z(d.zone).utci)})"></span>${zn(d.zone)} <span class="num faint sm">${Z(d.zone).utci.toFixed(1)}°</span></span></td><td>${devStatusBadge(d.status)}</td>
  <td><div class="seg"><button class="${d.mode==='auto'?'on':''}" data-act="mode" data-id="${d.id}" data-m="auto" ${S.autoPaused?'disabled':''}>${t('auto')}</button><button class="${d.mode==='manual'?'on':''}" data-act="mode" data-id="${d.id}" data-m="manual">${t('manual')}</button></div></td>
  <td class="sm"><span class="num">UTCI > ${d.th}°</span>${d.approval?`<div class="faint" style="font-size:11.5px">${t('requireApproval')}</div>`:''}</td><td class="sm muted">${L(d.last)}</td>
  <td style="white-space:nowrap">${d.status==='fault'?`<button class="btn btn-ghost btn-sm" data-act="newtask" data-zone="${d.zone}" data-target="${d.id}" data-type="repair">${A('مهمة صيانة','Repair task')}</button>`:d.status==='on'?`<button class="btn btn-ghost btn-sm" data-act="devoff" data-id="${d.id}">${t('turnOff')}</button>`:`<button class="btn btn-dark btn-sm" data-act="devon" data-id="${d.id}">${t('turnOn')}</button>`} <button class="btn btn-text btn-sm" data-act="config" data-id="${d.id}">${t('configure')}</button><button class="btn btn-text btn-sm" data-act="devhist" data-id="${d.id}">${A('السجل','History')}</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="card" style="margin-top:18px"><div class="card-head"><div><h3>${A('سجل تشغيل أجهزة','Run history —')} ${t(cat)}</h3><p>${A('أوقات التشغيل والإيقاف، تغيّر الحالة، والأعطال المسجلة اليوم — يفيد في تتبّع أسباب المشكلات','On/off times, state changes and faults today — useful for tracing problems')}</p></div></div>${devLogList(hist)}</div>`;
}
function openDevHist(id){
  const d=D(id), list=S.devLog.filter(l=>l.id===id).sort((a,b)=>tmin(b.t)-tmin(a.t)||b.n-a.n);
  const onMin=(()=>{let tot=0,start=null;[...list].reverse().forEach(l=>{if(l.ev==='on'&&start==null)start=tmin(l.t);if((l.ev==='off'||l.ev==='fault')&&start!=null){tot+=tmin(l.t)-start;start=null}});if(start!=null)tot+=minsAgo('00:00')-start;return tot})();
  modal(`${mHead(`${A('سجل التشغيل','Run history')} — ${d.code}`,`${t(d.sys)} · ${zfull(Z(d.zone))}`)}
  <div class="modal-b"><div class="compare" style="margin-bottom:14px"><div><div class="faint sm">${A('الحالة الآن','Now')}</div><div style="margin-top:6px">${devStatusBadge(d.status)} <span class="faint sm">${d.mode==='auto'?t('auto'):t('manual')}</span></div></div><div><div class="faint sm">${A('مدة التشغيل اليوم','Run time today')}</div><div class="num" style="font-size:20px;font-weight:600">${Math.floor(onMin/60)}${A('س','h')} ${onMin%60}${A('د','m')}</div></div></div>
  ${devLogList(list,false)}<p class="note" style="margin-top:8px">${I.info}${A('تُسجَّل هذه البيانات من الجهاز والنظام في قاعدة البيانات.','Recorded from the device and system into the database.')}</p></div>
  <div class="modal-f">${d.status==='fault'?`<button class="btn btn-primary" data-act="newtask" data-zone="${d.zone}" data-target="${d.id}" data-type="repair">${A('إنشاء مهمة صيانة','Create maintenance task')}</button>`:''}<button class="btn btn-ghost" data-act="mclose">${t('close')}</button></div>`);
}

function targetOptions(zid,sel){

    <optgroup label="${A('أعمدة الاستشعار','Sensor poles')}">${ps.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${p.id} — ${t(p.status)}</option>`).join('')}</optgroup>`;

function whoOptions(type,sel){
  const dp=TTYPE[type][1];
  const grp=d=>S.team.filter(m=>m.dept===d).sort((a,b)=>({free:0,busy:1,off:2}[mState(a)]-{free:0,busy:1,off:2}[mState(b)]));
  const firstFree=(grp(dp).find(m=>mState(m)!=='off')||{}).id;
  const pick=sel||firstFree;
  const opt=m=>{const s=mState(m),n=activeTasks(m).length;return `<option value="${m.id}" ${m.id===pick?'selected':''} ${s==='off'?'disabled':''}>${L(m.name)} — ${s==='free'?A('متاح','available'):s==='busy'?A(`مشغول · ${n} مهام`,`busy · ${n} task${n>1?'s':''}`):A('خارج الدوام','off shift')}</option>`};
  return [dp,...['maint','ops','admin'].filter(d=>d!==dp)].map(d=>`<optgroup label="${L(DEPT[d])}">${grp(d).map(opt).join('')}</optgroup>`).join('');

function teamHint(type){

}
function saveTask(d){
  const g=id=>document.getElementById(id).value;
  const desc=g('tkDesc').trim();
  if(!desc){const e=document.getElementById('tkErr');e.textContent=A('اكتب وصفًا مختصرًا للمهمة.','Add a short description.');e.style.display='block';document.getElementById('tkDesc').focus();return}
  const x={id:'T-'+(taskSeq++),zone:g('tkZone'),target:g('tkTarget'),type:g('tkType'),prio:g('tkPrio'),who:g('tkWho'),due:g('tkDue')||'—',status:'open',created:clockStr(S.clock),by:S.userId,desc:{ar:desc,en:desc}};
  const al=d.alert&&S.alerts.find(a=>a.id===d.alert);
  if(al){x.alert=al.id;al.task=x.id;al.status='progress';al.read=true}
  S.tasks.unshift(x);
  const m=MB(x.who);
  logAdd({ar:`إسناد ${x.id} إلى ${m.name.ar}`,en:`${x.id} assigned to ${m.name.en}`},{ar:`${TTYPE[x.type][0].ar} · ${'المنطقة '+x.zone} · ${x.target||'عام'} · بواسطة نورة القحطاني`,en:`${TTYPE[x.type][0].en} · Zone ${x.zone} · ${x.target||'general'} · by Noura Al-Qahtani`},'info','assign');
  closeModal();toast(A(`تم إنشاء ${x.id} وإسنادها إلى ${m.name.ar}`,`${x.id} created and assigned to ${m.name.en}`));soft();
}
function taskStep(id){
  const x=S.tasks.find(k=>k.id===id), m=MB(x.who), mk=TTYPE[x.type][1]==='maint'?'maint':'ops';
  if(x.status==='open'){x.status='progress';logAdd({ar:`بدء تنفيذ ${x.id}`,en:`${x.id} started`},{ar:`${m.name.ar} · ${TTYPE[x.type][0].ar}`,en:`${m.name.en} · ${TTYPE[x.type][0].en}`},'info',mk);toast(A('بدأ التنفيذ','Task started'));soft();return}
  x.status='done';x.doneAt=clockStr(S.clock);
  const al=x.alert&&S.alerts.find(a=>a.id===x.alert); if(al) al.status='resolved';
  const p=S.sensors.find(s=>s.id===x.target); if(p){p.status='online';p.last=4;if(x.type==='battery')p.batt=100}
  const dv=D(x.target); if(dv&&dv.status==='fault'){dv.status='off';dv.last={ar:`أُصلح ${x.doneAt} — جاهز`,en:`Repaired ${x.doneAt} — ready`};devLogAdd(dv.id,'off',{ar:`أُصلح ضمن ${x.id} — ${m.name.ar}`,en:`Repaired in ${x.id} — ${m.name.en}`})}
  logAdd({ar:`اكتمال ${x.id} — ${TTYPE[x.type][0].ar}`,en:`${x.id} done — ${TTYPE[x.type][0].en}`},{ar:`${m.name.ar} · ${'المنطقة '+x.zone}${al?' · أُغلق التنبيه المرتبط':''}`,en:`${m.name.en} · Zone ${x.zone}${al?' · linked alert closed':''}`},'ok',mk);
  toast(A(`اكتملت ${x.id}${al?' وأُغلق التنبيه':''}`,`${x.id} done${al?' — alert closed':''}`));soft();
}

function reportSections(keys){
  const days=T.days[LANG==='ar'?0:1];
  const S_={
    zones:{t:A('أداء المناطق','Zone performance'),h:[A('المنطقة','Zone'),A('الحالة','Status'),'UTCI',A('ساعات فوق 38° (7 أيام)','Hours above 38° (7 days)'),A('الزوار الآن','Visitors now')],r:[...S.zones].sort((a,b)=>b.utci-a.utci).map(z=>[`${zn(z.id)} — ${L(z.name)}`,t('st_'+stOf(z.utci)),z.utci.toFixed(1),(AN.perf.find(p=>p[0]===z.id)||[0,'—'])[1],z.visitors])},
    maint:{t:A('الصيانة والتدخلات','Maintenance & interventions'),h:[A('المهمة','Task'),A('النوع','Type'),A('المنطقة','Zone'),A('الجهاز','Device'),A('المسؤول','Assignee'),A('الحالة','Status'),A('الوصف','Description')],r:S.tasks.map(x=>[x.id,L(TTYPE[x.type][0]),zn(x.zone),x.target||'—',L(MB(x.who).name),L(TSTAT[x.status]),L(x.desc)])},
    peak:{t:A('ساعات الذروة','Peak hours'),h:[A('الساعة','Hour'),A('متوسط التدخلات','Avg. interventions')],r:AN.ivHour.map(([h,v])=>[`${h}:00`,v])},
    eff:{t:A('الكفاءة التشغيلية','Operational efficiency'),h:[A('المؤشر','Metric'),A('القيمة','Value')],r:[[t('interventions'),142],[t('approvedRate'),'87%'],[t('respTime'),'2.4 '+t('minutes')],[t('autoRuns'),61],[A('توفير المياه','Water saved'),'37%'],[A('توفير الطاقة','Energy saved'),'24%']]},
    auto:{t:A('أداء الأتمتة','Automation performance'),h:[A('النظام','System'),A('تشغيل تلقائي (7 أيام)','Automatic runs (7 days)')],r:AN.autoSys.map(([k,v])=>[t(k),v])},
    events:{t:A('تحليلات الفعاليات','Event analytics'),h:[A('الفعالية','Event'),A('المنطقة','Zone'),A('الوقت','Time'),A('الزوار المتوقعون','Expected visitors'),'UTCI',A('الحاجة للتدخل','Action need')],r:S.events.map(e=>[L(e.name),zn(e.zone),e.time,e.visitors,e.utci,{need:A('يحتاج تدخل','Needs action'),watch:A('متابعة','Monitor'),none:A('لا يحتاج','None')}[evNeed(e)]])},

function downloadFile(name,content,type){
  const blob=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);

function doExport(){
  const keys=[...document.querySelectorAll('#exSec input:checked')].map(i=>i.value);
  if(!keys.length){const e=document.getElementById('exErr');e.textContent=A('اختر قسمًا واحدًا على الأقل.','Pick at least one section.');e.style.display='block';return}
  const fmt=document.querySelector('input[name=exFmt]:checked').value, period=document.getElementById('exPeriod').value;
  const secs=reportSections(keys), title=A('تقرير هبوب التشغيلي','Haboob operations report'), dir=LANG==='ar'?'rtl':'ltr';
  const esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(fmt==='xls'){
    // SpreadsheetML: opens in Excel with one worksheet per section
