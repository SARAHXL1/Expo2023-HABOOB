/* ---------------- Modal & toast ---------------- */
function modal(html,wide){document.getElementById('modal-root').innerHTML=`<div class="modal-bg" data-act="mclose-bg"><div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;const b=document.querySelector('.modal .btn-primary,.modal .btn-dark');b&&b.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function toast(msg){const el=document.createElement('div');el.className='toast';el.innerHTML=I.check+`<span>${msg}</span>`;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3600)}
const mHead=(title,sub)=>`<div class="modal-h"><div><h2>${title}</h2>${sub?`<p class="muted sm" style="margin-top:4px">${sub}</p>`:''}</div><button class="icon-btn" data-act="mclose" aria-label="${t('close')}">${I.x}</button></div>`;
function logAdd(x,s,c='brand',k='ops'){if(S.authed){x=nm(x);s=nm(s)}S.log.unshift({t:clockStr(S.clock),x,s,c,k,isNew:true});setTimeout(()=>S.log.forEach(l=>l.isNew=false),2500)}

/* Main demo action: AI recommendation -> operator approval -> action */
function openActivate(zid){
  const z=Z(zid), rec=recFor(z); if(!rec) return;
  if(zid==='C') bumpStep(4);
  const cmds=rec.sys.map(s=>s==='shading'?'cmdShade':s==='misting'?'cmdMist':'cmdFans');
  modal(`${mHead(t('approveTitle')+' — '+zn(zid),L(z.name))}
  <div class="modal-b"><p class="muted">${t('approveP')}</p>
    <ul class="steps-list" style="margin-top:14px" id="cmdList">${[...cmds,'cmdVerify'].map(k=>`<li data-k="${k}"><span class="st"></span>${t(k)}</li>`).join('')}</ul>
    <div class="compare" style="margin-top:16px"><div><div class="faint sm">UTCI ${LANG==='ar'?'الآن':'now'}</div><div class="num" style="font-size:24px;font-weight:600;color:var(--${stOf(z.utci)})">${z.utci.toFixed(1)}°</div></div><div class="best"><div class="faint sm">${LANG==='ar'?'المتوقع بعد 6 دقائق':'Expected in 6 min'}</div><div class="num" style="font-size:24px;font-weight:600;color:var(--brand)">${(z.utci-rec.drop).toFixed(1)}°</div></div></div>
  </div>
  <div class="modal-f"><button class="btn btn-text" data-act="mclose">${t('cancel')}</button><button class="btn btn-primary" data-act="doActivate" data-id="${zid}">${t('approve')}</button></div>`);
}
function doActivate(zid){
  const z=Z(zid), rec=recFor(z);
  const btns=document.querySelectorAll('.modal-f .btn'); btns.forEach(b=>b.disabled=true);
  document.querySelector('.modal-f .btn-primary').textContent=t('sending');
  const items=[...document.querySelectorAll('#cmdList li')];
  let i=0;
  const step=()=>{
    if(i>0){items[i-1].classList.remove('doing');items[i-1].classList.add('done');items[i-1].querySelector('.st').innerHTML=I.check}
    if(i<items.length){items[i].classList.add('doing');i++;setTimeout(step,650)}
    else setTimeout(()=>finishActivate(zid,rec),350);
  };
  step();
}
function finishActivate(zid,rec){
  const z=Z(zid); const prevSt=stOf(z.utci);
  z.prev=z.utci;
  const target=+(z.utci-rec.drop).toFixed(1);
  z.mitigated=true;
  if(rec.sys.includes('shading')){z.solar=Math.round(z.solar*.24)}
  if(rec.sys.includes('misting')){z.temp=+(z.temp-3.2).toFixed(1);z.hum=z.hum+14}
  if(rec.sys.includes('fans')){z.wind=+(z.wind+2.1).toFixed(1)}
  z.utci=target;
  rec.sys.forEach(s=>{const d=D(zid+'-'+s); if(d){d.status='on';d.last={ar:`اعتمدته ${ME().name.ar.split(' ')[0]} ${clockStr(S.clock)}`,en:`Approved by ${ME().name.en.split(' ')[0]} ${clockStr(S.clock)}`}}});
  S.alerts.filter(a=>a.zone===zid&&a.type==='heat'&&a.status!=='resolved').forEach(a=>a.status='resolved');
  logAdd({ar:`${L(rec.title)} — ${zn(zid)}`,en:`${rec.title.en} — Zone ${zid}`},{ar:`توصية هبوب · اعتمدتها نورة القحطاني · UTCI ${z.prev}° ← ${target}°`,en:`Haboob recommendation · approved by Noura Al-Qahtani · UTCI ${z.prev}° → ${target}°`});
  S.kpiFlash=['ok','attn','crit','alerts']; setTimeout(()=>S.kpiFlash=null,1500);
  if(zid==='C') bumpStep(6);
  const newSt=stOf(target);
  modal(`<div class="modal-b" style="text-align:center;padding-top:30px"><div class="success-mark">${I.check}</div><h2>${t('doneTitle')}</h2><p class="muted" style="margin-top:6px">${t('doneP')}</p>
    <div style="display:flex;justify-content:center;align-items:center;gap:14px;margin:20px 0 6px">${stBadge(prevSt)}<span class="faint">${LANG==='ar'?'←':'→'}</span>${stBadge(newSt)}</div>
    <div class="num faint">UTCI ${z.prev.toFixed(1)}° ${LANG==='ar'?'←':'→'} <b style="color:var(--${newSt})">${target.toFixed(1)}°</b></div></div>
    <div class="modal-f" style="justify-content:center"><button class="btn btn-ghost" data-act="mclose">${t('stayHere')}</button><button class="btn btn-primary" data-act="toOverviewFlash" data-id="${zid}">${t('backOverview')}</button></div>`);
  if(S.route==='zone') render();
}

function openOptimize(eid){
  const e=S.events.find(x=>x.id===eid); if(!e||!e.opt) return;
  const o=e.opt;
  modal(`${mHead(t('optTitle'),L(e.name)+' · '+e.visitors.toLocaleString('en')+' '+t('visitors'))}
  <div class="modal-b" id="optBody"><div style="display:flex;align-items:center;gap:10px;padding:30px 0;justify-content:center" class="muted"><span class="st" style="width:20px;height:20px;border-radius:50%;border:2px solid var(--brand);border-top-color:transparent;animation:spin .8s linear infinite;display:inline-block"></span>${LANG==='ar'?'هبوب يحلل توقعات 24 منطقة…':'Haboob is analyzing forecasts for 24 zones…'}</div></div>
  <div class="modal-f"><button class="btn btn-text" data-act="mclose">${t('cancel')}</button><button class="btn btn-primary" data-act="applyOpt" data-id="${eid}" disabled id="applyBtn">${t('apply')}</button></div>`);
  setTimeout(()=>{const b=document.getElementById('optBody'); if(!b) return;
    b.innerHTML=`<div class="compare">
      <div><b>${t('current')}</b><dl><dt>${t('ev_zone')}</dt><dd>${zn(e.zone)}</dd><dt>${t('ev_time')}</dt><dd class="num">${e.time}</dd><dt>${t('expUtci')}</dt><dd class="num" style="color:var(--crit)">${e.utci}°</dd><dt>${t('wind')}</dt><dd class="num">${Z(e.zone).wind} m/s</dd></dl><div style="margin-top:10px">${riskBadge(e.risk)}</div></div>
      <div class="best"><b style="color:var(--brand)">${I.spark.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px"')} ${t('suggested')}</b><dl><dt>${t('bestZone')}</dt><dd>${zn(o.zone)}</dd><dt>${t('bestTime')}</dt><dd class="num">${o.time}</dd><dt>${t('expUtci')}</dt><dd class="num" style="color:var(--ok)">${o.utci}°</dd><dt>${t('wind')}</dt><dd class="num">${Z(o.zone).wind} m/s</dd></dl><div style="margin-top:10px">${riskBadge(o.utci<32?'low':'mod')}</div></div></div>
      <div class="rec-line" style="margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px"><b>${t('reason')}:</b> ${L(o.reason)}</div>`;
    document.getElementById('applyBtn').disabled=false;
  },900);

/* ---------------- Render & routing ---------------- */
const ROUTES=['mytasks','overview','map','zone','alerts','automation','maintenance','team','analytics','sensors','settings','account'];
function render(){
  const app=document.getElementById('app');
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.title=(LANG==='ar'?'هبوب':'HABOOB')+' | '+t(navKey[S.route]||'overview');
  if(!S.authed){app.innerHTML=pageLogin();bindLogin();return}
  const pages={mytasks:pageMyTasks,overview:pageOverview,map:pageMap,zone:pageZone,alerts:pageAlerts,automation:pageAutomation,maintenance:pageMaintenance,team:pageTeam,analytics:pageAnalytics,sensors:pageSensors,settings:pageSettings,account:pageAccount};
  const y=window.scrollY;
  app.innerHTML=shell((pages[S.route]||pageOverview)());
  if(S._keepScroll) window.scrollTo(0,y); S._keepScroll=false;
  bindSearch('sq','sensorQ'); bindSearch('zq','zoneQ');
}
function bindSearch(id,key){
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener('input',e=>{S[key]=e.target.value;const pos=e.target.selectionStart;S._keepScroll=true;render();const n=document.getElementById(id);n.focus();n.setSelectionRange(pos,pos)});
}
function soft(){S._keepScroll=true;render()}
function route(){
  let h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='zones'){h=['map'];S.scrollTo='zonesTable'}
  if(h[0]==='events'){h=['map'];S.scrollTo='eventsSec'}
  S.route=ROUTES.includes(h[0])?h[0]:(S.authed?ROLECFG[ROLE()].home:'overview');
  if(S.authed&&!allowedRoute(S.route)){S.route=ROLECFG[ROLE()].home;S.param=null;history.replaceState(null,'','#/'+S.route)}
  S.param=h[1]||null; S.popPole=null; S.menu=null;
  if(S.route==='map') S.mapSel=S.param||null;
  render();
  if(S.scrollTo){const el=document.getElementById(S.scrollTo);S.scrollTo=null;if(el){el.scrollIntoView({block:'start'});return}}
  window.scrollTo(0,0);
}
function go(r){const h='#/'+r; if(location.hash===h) route(); else location.hash=h}
function bindLogin(){
  const f=document.getElementById('loginForm');
  f&&f.addEventListener('submit',e=>{e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent=t('signingIn');
    setTimeout(()=>{S.authed=true;bumpStep(1);if(!location.hash||location.hash==='#/')location.hash='#/overview';route();
      setTimeout(()=>{S.newAlert='a1';toast(t('newAlert'));},1200);},700)});
}

  <div class="ov-grid" style="grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr)">
    <div><h2 style="margin-bottom:12px">${A('مهامي الحالية','My current tasks')} <span class="faint num">(${act.length})</span></h2>
      <div class="grid" style="gap:12px">${act.map(taskCard).join('')||`<div class="card empty">${ic(I.check,28,'')}<p style="margin-top:8px">${A('لا توجد مهام مسندة إليك الآن.','No tasks assigned to you right now.')}</p></div>`}</div>
      ${done.length?`<h3 style="margin:22px 0 10px" class="muted">${A('أنجزتها اليوم','Done today')}</h3><div class="card">${done.map(x=>`<div class="dev-row" style="padding:12px 18px"><div class="dev-ic on">${I.check}</div><div style="flex:1;min-width:0"><b class="num">${x.id}</b> · ${L(TTYPE[x.type][0])}<div class="faint sm">${zn(x.zone)} · ${A('أُنجزت','done')} <span class="num">${x.doneAt||''}</span></div></div></div>`).join('')}</div>`:''}</div>
    ${side}
  </div>`;
}

/* ---------- action guards ---------- */
Object.assign(actions,{
  loginRole:d=>{S.loginRole=d.k;S.loginUser=ROLECFG[d.k].def;render()},
  alertdo:(()=>{const orig=actions.alertdo;return d=>{const a=S.alerts.find(x=>x.id===d.id);if(!a)return;
    if(!can(needPerm(a))){markRead(a.id);S.menu=null;const mt=a.task&&S.tasks.find(x=>x.id===a.task&&x.who===S.userId);
      if(mt)return go('mytasks');if(a.type==='heat'||a.type==='device')return go('zone/'+a.zone);
      S.alertFocus=a.id;S.scrollTo='al-'+a.id;toast(A('بانتظار قرار أو إسناد من المسؤول','Awaiting an admin decision or assignment'));return go('alerts')}
    orig(d)}})(),
  taskStep:d=>{const x=S.tasks.find(k=>k.id===d.id);if(x.who!==S.userId&&!can('assign')){toast(A('هذه المهمة ليست مسندة إليك','This task isn’t assigned to you'));return}taskStep(d.id)},
  logout:()=>{S.menu=null;S.authed=false;S.demoStep=0;applyPermCss();location.hash='';render()},
});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||!S.authed)return;const p=ACTPERM[el.dataset.act];
  if(p&&!can(p)){ev.stopPropagation();ev.preventDefault();toast(A('هذا الإجراء يتطلب صلاحية أعلى','This action needs a higher permission'))}},true);
document.addEventListener('change',ev=>{if(ev.target.id==='acc'){S.loginUser=ev.target.value;document.getElementById('em').value=MB(ev.target.value).email}});

window.addEventListener('hashchange',()=>{if(S.authed)route()});
setInterval(()=>{S.clock=new Date(S.clock.getTime()+1000);const c=document.getElementById('clk');if(c)c.textContent=clockStr(S.clock)},1000);
render();
</script>
</body>
</html>
