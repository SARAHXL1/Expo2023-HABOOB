/* approve all / partial approval */
const SHARE={shading:.55,misting:.45,fans:1,coolingSys:1};
const cmdOf=s=>s==='shading'?'cmdShade':s==='misting'?'cmdMist':'cmdFans';
const dropFor=(rec,sel)=>rec.sys.length===1?rec.drop:+(rec.drop*sel.reduce((a,s)=>a+(SHARE[s]||0),0)).toFixed(1);
openActivate=function(zid,partial){
  const z=Z(zid), rec=recFor(z); if(!rec) return;
  if(zid==='C') bumpStep(4);
  partial=!!partial&&rec.sys.length>1;
  const body=partial?`<p class="muted">${A('اختر الإجراءات التي تريد اعتمادها. ما لا تختاره لن يُنفَّذ، وسيُسجَّل كمرفوض.','Choose the actions to approve. Anything you leave unticked won’t run and is logged as rejected.')}</p>
    <div class="pick" style="margin-top:14px">${rec.sys.map(s=>`<label><input type="checkbox" value="${s}" checked><span class="dev-ic on" style="width:34px;height:34px">${SYSI[s]}</span><span class="pk-t"><b>${t(cmdOf(s))}</b><small>${A('خفض متوقع','Expected drop')} <span class="num">−${dropFor(rec,[s])}°</span>${s==='misting'?` · <span class="num">${rec.water} L/h</span>`:''}</small></span></label>`).join('')}</div>`
    :`<p class="muted">${t('approveP')}</p><ul class="steps-list" style="margin-top:14px" id="cmdList">${[...rec.sys.map(cmdOf),'cmdVerify'].map(k=>`<li data-k="${k}"><span class="st"></span>${t(k)}</li>`).join('')}</ul>`;
  modal(`${mHead((partial?A('قبول جزئي','Partial approval'):rec.sys.length>1?A('قبول كل الإجراءات','Approve all actions'):t('approveTitle'))+' — '+zn(zid),L(z.name)+' · '+L(rec.title))}
  <div class="modal-b" id="actBody">${body}
    <div class="compare" style="margin-top:16px"><div><div class="faint sm">UTCI ${A('الآن','now')}</div><div class="num" style="font-size:24px;font-weight:600;color:var(--${stOf(z.utci)})">${z.utci.toFixed(1)}°</div></div><div class="best"><div class="faint sm">${A('المتوقع بعد 6 دقائق','Expected in 6 min')}</div><div class="num" id="expU" style="font-size:24px;font-weight:600;color:var(--brand)">${(z.utci-rec.drop).toFixed(1)}°</div></div></div>
  </div>
  <div class="modal-f"><button class="btn btn-text" data-act="mclose">${t('cancel')}</button>${partial?`<button class="btn btn-primary" data-act="doActivate" data-id="${zid}" id="actGo">${A('اعتماد المحدد','Approve selected')} · <span class="num" id="pkN">${rec.sys.length}</span></button>`:`<button class="btn btn-primary" data-act="doActivate" data-id="${zid}">${rec.sys.length>1?A('قبول الكل وتفعيل','Approve all & activate'):t('approve')}</button>`}</div>`);
};
function updatePick(){
  const z=Z(S.selZone), sel=[...document.querySelectorAll('.pick input:checked')].map(i=>i.value), go=document.getElementById('actGo');
  const zid=go&&go.dataset.id, zz=Z(zid)||z, rec=recFor(zz); if(!rec) return;
  document.getElementById('pkN').textContent=sel.length; go.disabled=!sel.length;
  document.getElementById('expU').textContent=(zz.utci-dropFor(rec,sel)).toFixed(1)+'°';
}
doActivate=function(zid){
  const z=Z(zid), rec=recFor(z); if(!rec) return;
  const picks=document.querySelectorAll('.pick input');
  const sel=picks.length?[...picks].filter(i=>i.checked).map(i=>i.value):rec.sys.slice();
  if(!sel.length) return;
  if(picks.length){document.querySelector('#actBody .pick').outerHTML=`<ul class="steps-list" style="margin-top:14px" id="cmdList">${[...sel.map(cmdOf),'cmdVerify'].map(k=>`<li data-k="${k}"><span class="st"></span>${t(k)}</li>`).join('')}</ul>`}
  document.querySelectorAll('.modal-f .btn').forEach(b=>b.disabled=true);
  const pb=document.querySelector('.modal-f .btn-primary'); if(pb) pb.textContent=t('sending');
  const items=[...document.querySelectorAll('#cmdList li')]; let i=0;
  const step=()=>{if(i>0){items[i-1].classList.remove('doing');items[i-1].classList.add('done');items[i-1].querySelector('.st').innerHTML=I.check}
    if(i<items.length){items[i].classList.add('doing');i++;setTimeout(step,600)} else setTimeout(()=>finishActivate(zid,rec,sel),300)};
  step();
};
finishActivate=function(zid,rec,sel){
  sel=sel||rec.sys.slice();
  const z=Z(zid), prevSt=stOf(z.utci), drop=dropFor(rec,sel), partial=sel.length<rec.sys.length, rest=rec.sys.filter(s=>!sel.includes(s));
  z.prev=z.utci; const target=+(z.utci-drop).toFixed(1);
  z.mitigated=true; z.applied=sel.slice();
  if(sel.includes('shading')) z.solar=Math.round(z.solar*.24);
  if(sel.includes('misting')){z.temp=+(z.temp-3.2).toFixed(1);z.hum=z.hum+14}
  if(sel.includes('fans')) z.wind=+(z.wind+2.1).toFixed(1);
  z.utci=target;
  const who=ME().name;
  sel.forEach(s=>{const d=D(zid+'-'+s); if(d){d.status='on';d.last={ar:`اعتمدته ${who.ar.split(' ')[0]} ${clockStr(S.clock)}`,en:`Approved by ${who.en.split(' ')[0]} ${clockStr(S.clock)}`};devLogAdd(d.id,'on',{ar:`توصية هبوب — ${partial?'قبول جزئي':'قبول'} ${who.ar}`,en:`Haboob rec. — ${partial?'partial ':''}approval by ${who.en}`})}});
  S.alerts.filter(a=>a.zone===zid&&a.type==='heat'&&a.status!=='resolved').forEach(a=>{a.status='resolved';a.read=true});
  const nm2=a=>a.map(s=>T[s][0]).join(' + '), nmE=a=>a.map(s=>T[s][1]).join(' + ');
  logAdd(partial?{ar:`قبول جزئي: ${nm2(sel)} — المنطقة ${zid}`,en:`Partial approval: ${nmE(sel)} — Zone ${zid}`}:{ar:`${L(rec.title)} — المنطقة ${zid}`,en:`${rec.title.en} — Zone ${zid}`},
    {ar:`توصية هبوب · اعتمدتها نورة القحطاني · UTCI ${z.prev}° ← ${target}°${partial?` · رُفض: ${nm2(rest)}`:''}`,en:`Haboob recommendation · approved by Noura Al-Qahtani · UTCI ${z.prev}° → ${target}°${partial?` · rejected: ${nmE(rest)}`:''}`},'brand','ops',{zone:zid,dev:sel.map(s=>D(zid+'-'+s)&&D(zid+'-'+s).code).filter(Boolean).join('، '),res:partial?'partial':'done'});
  S.kpiFlash=['ok','attn','crit','alerts']; setTimeout(()=>S.kpiFlash=null,1500);
  if(zid==='C') bumpStep(6);
  const newSt=stOf(target);
  modal(`<div class="modal-b" style="text-align:center;padding-top:30px"><div class="success-mark">${I.check}</div><h2>${partial?A('تم تفعيل الإجراءات المحددة','Selected actions activated'):t('doneTitle')}</h2><p class="muted" style="margin-top:6px">${partial?`${A('تم تفعيل','Activated')}: <b>${sel.map(s=>t(s)).join(' + ')}</b> · ${A('لم يُفعَّل','Not activated')}: ${rest.map(s=>t(s)).join(' + ')}`:t('doneP')}</p>
    <div style="display:flex;justify-content:center;align-items:center;gap:14px;margin:20px 0 6px">${stBadge(prevSt)}<span class="faint">${LANG==='ar'?'←':'→'}</span>${stBadge(newSt)}</div>
    <div class="num faint">UTCI ${z.prev.toFixed(1)}° ${LANG==='ar'?'←':'→'} <b style="color:var(--${newSt})">${target.toFixed(1)}°</b></div></div>
    <div class="modal-f" style="justify-content:center"><button class="btn btn-ghost" data-act="mclose">${t('stayHere')}</button><button class="btn btn-primary" data-act="toOverviewFlash" data-id="${zid}">${t('backOverview')}</button></div>`);
  S._keepScroll=true; render();
};

/* ---------- note 11: structured operations log ---------- */
logAdd=function(x,s,c='brand',k='ops',meta={}){if(S.authed){x=nm(x);s=nm(s)}S.log.unshift({t:clockStr(S.clock),x,s,c,k,isNew:true,...meta});setTimeout(()=>S.log.forEach(l=>l.isNew=false),2500)};
const LOGFIX={'Misting started — Zone K':{dev:'MST-K1'},'Fans started — Zone B':{dev:'FAN-B1'},'Shades deployed — Zone L':{dev:'SHD-L1'},'Battery replaced on HB-P22':{zone:'V'}};
S.log.forEach(l=>Object.assign(l,LOGFIX[l.x.en]||{}));
const LRES={assign:['b-info',{ar:'مسندة',en:'Assigned'}],done:['b-ok',{ar:'مكتملة',en:'Completed'}],progress:['b-cau',{ar:'قيد التنفيذ',en:'In progress'}],auto:['b-ok',{ar:'نُفّذ تلقائيًا',en:'Ran automatically'}],ok:['b-ok',{ar:'نُفّذ',en:'Done'}],
  rejected:['b-neutral',{ar:'مرفوض',en:'Rejected'}],scheduled:['b-info',{ar:'مجدول',en:'Scheduled'}],manual:['b-crit',{ar:'تحكم يدوي',en:'Manual control'}],partial:['b-cau',{ar:'قبول جزئي',en:'Partially approved'}]};
function logMeta(l){
  const xa=l.x.ar||'', sa=l.s.ar||'', te=(l.x.en||'')+' · '+(l.s.en||''), ta=xa+' · '+sa;
  const zone=l.zone||(te.match(/Zone ([A-X])\b/)||[])[1]||(ta.match(/المنطقة ([A-X])/)||[])[1]||'';
  let dev=l.dev||(te.match(/\b(HB-P\d\d|[A-Z]{3}-[A-X]1)\b/)||[])[1]||'';

      <dt>${A('الوقت','Time')}</dt><dd>${x.status==='done'?`${A('أُنجزت','Done')} <span class="num">${x.doneAt||''}</span>`:`${A('موعد التنفيذ','Due')} <b class="num">${x.due}</b>${late?` <span class="badge b-crit" style="padding:1px 8px">${A('متأخرة','Overdue')}</span>`:''}`} <span class="faint sm">· ${A('أُسندت','Assigned')} <span class="num">${x.created}</span>${by?' '+A('بواسطة','by')+' '+L(by.name):''}</span></dd>
    </dl>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${x.status==='open'?`<button class="btn btn-primary" data-act="taskStep" data-id="${x.id}">${ic(I.play,16,'')} ${A('بدء التنفيذ','Start')}</button>`:x.status==='progress'?`<button class="btn btn-primary" data-act="taskStep" data-id="${x.id}">${I.check} ${A('تم الإنجاز','Mark done')}</button>`:''}<button class="btn btn-ghost" data-act="taskLoc" data-id="${x.id}">${I.pin} ${A('تفاصيل الموقع','Location details')}</button>${D(x.target)&&VALDEF[D(x.target).sys]?`<button class="btn btn-text" data-act="devhist" data-id="${x.target}">${A('سجل الجهاز','Device log')}</button>`:''}</div></div>`;
};
pageMyTasks=function(){
  const me=ME(), dp=me.dept, mine=myTasks();
  const ord=(a,b)=>PRANK[a.prio]-PRANK[b.prio]||tmin(a.due==='—'?'23:59':a.due)-tmin(b.due==='—'?'23:59':b.due);
  const prog=mine.filter(x=>x.status==='progress').sort(ord), open=mine.filter(x=>x.status==='open').sort(ord), done=mine.filter(x=>x.status==='done');
  const nextDue=[...prog,...open].sort((a,b)=>tmin(a.due)-tmin(b.due))[0];
  const sec=(title,list,empty,cls)=>`<div class="tk-sec"><h2>${title}</h2><span class="badge ${cls} num">${list.length}</span></div>${list.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px">${list.map(taskCard).join('')}</div>`:`<div class="card empty" style="padding:20px">${empty}</div>`}`;
  return `<div class="page-head"><div style="display:flex;gap:14px;align-items:center">${avatarOf(me,'lg')}<div><h1>${A('مرحبًا','Hello')}، ${L(me.name).split(' ')[0]}</h1><p class="muted">${L(me.title)} · ${L(DEPT[dp])}</p></div></div>${mBadge(mState(me))}</div>
  <div class="card card-pad" style="margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(160deg,var(--brand-soft),var(--surface) 70%)"><div class="dev-ic on" style="width:44px;height:44px">${I.task}</div><div style="flex:1;min-width:220px"><b style="font-size:16px">${A('ما المهام التي يجب أن أنفذها؟','Which tasks do I need to do?')}</b><div class="muted sm">${prog.length+open.length?`${A('لديك','You have')} <b class="num">${prog.length+open.length}</b> ${A('مهام مفتوحة','open tasks')}${nextDue?` · ${A('الأقرب موعدًا','next due')}: <b class="num">${nextDue.id}</b> ${A('الساعة','at')} <b class="num">${nextDue.due}</b>`:''}`:A('لا توجد مهام مفتوحة مسندة إليك الآن.','No open tasks assigned to you right now.')}</div></div>
    <div class="stat-row" style="grid-template-columns:repeat(3,auto);gap:8px"><div class="stat" style="padding:8px 14px"><b class="num" style="color:var(--cau);font-size:20px">${prog.length}</b><span>${L(TSTAT.progress)}</span></div><div class="stat" style="padding:8px 14px"><b class="num" style="color:var(--info);font-size:20px">${open.length}</b><span>${A('بانتظار البدء','To start')}</span></div><div class="stat" style="padding:8px 14px"><b class="num" style="color:var(--ok);font-size:20px">${done.length}</b><span>${A('أنجزتها اليوم','Done today')}</span></div></div></div>
  ${sec(A('قيد التنفيذ الآن','In progress now'),prog,A('لا توجد مهام قيد التنفيذ.','Nothing in progress.'),'b-cau')}
  ${sec(dp==='maint'?A('مهام الصيانة بانتظار البدء','Maintenance tasks to start'):A('مهام بانتظار البدء','Tasks to start'),open,A('لا توجد مهام جديدة.','No new tasks.'),'b-info')}
  ${done.length?`<div class="tk-sec"><h2 class="muted">${A('أنجزتها اليوم','Done today')}</h2><span class="badge b-ok num">${done.length}</span></div><div class="card">${done.map(x=>`<div class="dev-row" style="padding:12px 18px"><div class="dev-ic on">${I.check}</div><div style="flex:1;min-width:0"><b class="num">${x.id}</b> · ${taskTitle(x)}<div class="faint sm">${zfull(Z(x.zone))} · ${A('أُنجزت','done')} <span class="num">${x.doneAt||''}</span></div></div></div>`).join('')}</div>`:''}`;
};
function openTaskLoc(id){
  const x=S.tasks.find(k=>k.id===id), z=Z(x.zone), st=stOf(z.utci), d=D(x.target), p=S.sensors.find(s=>s.id===x.target);
  const poles=zonePoles(z.id);
  modal(`${mHead(`${A('موقع المهمة','Task location')} — <span class="num">${x.id}</span>`,taskTitle(x))}
  <div class="modal-b"><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">
    <div style="pointer-events:none;max-width:320px">${renderMap({sel:z.id,dimOthers:true})}</div>
    <div><dl class="kv"><dt>${A('المنطقة','Zone')}</dt><dd><b>${zfull(z)}</b></dd>
      ${d?`<dt>${A('الجهاز','Device')}</dt><dd>${t(d.sys)} <b class="num">${d.code}</b><div style="margin-top:4px">${devStatusBadge(d.status)}</div></dd>`:''}
      ${p?`<dt>${A('العمود','Pole')}</dt><dd><b class="num">${p.id}</b> — ${A('عمود','pole')} <span class="num">${p.k+1}</span> ${A('من','of')} <span class="num">${poles.length}</span> ${A('في المنطقة','in this zone')}<div style="margin-top:4px">${sensBadge(p.status)} <span class="num sm">${p.batt}%</span></div></dd>`:''}
      <dt>${A('الظروف الآن','Conditions now')}</dt><dd>UTCI <b class="num" style="color:var(--${st})">${z.utci.toFixed(1)}°</b> ${stBadge(st)}</dd>
      <dt>${A('الزوار','Visitors')}</dt><dd class="num">${z.visitors.toLocaleString('en')}</dd></dl>
      ${st==='crit'||st==='heat'?`<div class="desc-box" style="border-color:color-mix(in srgb,var(--heat) 35%,var(--line))">${ic(I.sun,15)} ${A('الحرارة مرتفعة في الموقع — اشرب الماء، واستخدم الظل، ولا تعمل منفردًا تحت الشمس لفترة طويلة.','Heat is high on site — drink water, use shade, and avoid long solo work in direct sun.')}</div>`:''}</div>
  </div></div>
  <div class="modal-f">${x.status==='open'?`<button class="btn btn-primary" data-act="taskStepM" data-id="${x.id}">${A('بدء التنفيذ','Start')}</button>`:x.status==='progress'?`<button class="btn btn-primary" data-act="taskStepM" data-id="${x.id}">${A('تم الإنجاز','Mark done')}</button>`:''}<button class="btn btn-ghost" data-act="mclose">${t('close')}</button></div>`,true);
}
function tasksBell(){
  const mine=myTasks().filter(x=>x.status!=='done').sort((a,b)=>TRANK[b.status]-TRANK[a.status]||tmin(a.due)-tmin(b.due));
  return `<div class="pop-menu" style="width:360px"><div class="mh"><b>${A('مهامي المفتوحة','My open tasks')} <span class="faint num">(${mine.length})</span></b><div class="faint sm">${A('الإشعارات تخص المهام المسندة إليك فقط','Notifications cover only tasks assigned to you')}</div></div>
    ${mine.map(x=>`<button class="mi" data-act="goto" data-to="mytasks"><span class="sev ${x.prio==='high'?'crit':x.prio==='med'?'cau':'info'}" style="width:30px;height:30px">${I.task}</span><span style="min-width:0"><b class="num">${x.id}</b> · ${L(TTYPE[x.type][0])}<small>${zn(x.zone)} · ${L(TSTAT[x.status])} · ${A('الموعد','Due')} <span class="num">${x.due}</span></small></span></button>`).join('')||`<div class="empty">${A('لا توجد مهام مفتوحة','No open tasks')}</div>`}</div>`;
}
shell=function(content){
  const admin=isAdmin(), c=counts(), ss=sensSum(), un=unreadN(), open=S.tasks.filter(x=>x.status!=='done').length;
  const myOpen=myTasks().filter(x=>x.status!=='done').length, myNew=myTasks().filter(x=>x.status==='open').length;
  const cur=S.route==='zone'?'map':S.route, running=S.devices.filter(d=>d.status==='on').length;
  return `<div class="shell">
  <aside class="side">
    <div class="brand">${logoSvg()}<div class="brand-txt"><div class="brand-name">${LANG==='ar'?'هبوب':'HABOOB'}</div><div class="brand-sub">${t('appSub')}</div></div></div>
    <nav class="nav">${navFor().map(([k,icn],i)=>`${k==='sensors'&&i>0?'<div class="nav-sep"></div>':''}<a href="#/${k}" class="${cur===k?'on':''}" title="${t(navKey[k])}" ${cur===k?'aria-current="page"':''}>${icn}<span class="lbl">${t(navKey[k])}</span>${k==='alerts'&&c.alerts?`<span class="count num" title="${un} ${A('غير مقروء','unread')}">${c.alerts}</span>`:''}${k==='maintenance'&&open?`<span class="count soft num">${open}</span>`:''}${k==='mytasks'&&myOpen?`<span class="count num">${myOpen}</span>`:''}</a>`).join('')}</nav>
    <div class="side-prefs">${prefsCtl(true)}</div>
    ${admin?`<div class="side-foot"><b style="color:${S.autoPaused?'var(--crit)':'var(--ink)'}">${S.autoPaused?A('الأتمتة موقوفة','Automation paused'):A('الأتمتة تعمل','Automation running')}</b><span class="num">${running}</span> ${A('أجهزة تعمل الآن','devices running now')}<div style="margin-top:8px"><a class="link" href="#/automation">${A('إدارة الأتمتة','Manage automation')} ${I.arrow.replace('<svg','<svg class="fl"')}</a></div></div>`
      :`<div class="side-foot"><b>${L(ROLECFG[ROLE()].t)}</b>${L(ROLECFG[ROLE()].d)}</div>`}
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb">${t(navKey[S.route])}</div>
      <span class="demo-tag">${t('demo')}</span>
      <div class="spacer"></div>
      ${admin&&S.autoPaused?`<button class="sys paused" data-act="goto" data-to="automation">${ic(I.stop,15,'')}<span class="lbl">${A('الأتمتة موقوفة','Automation paused')}</span></button>`:''}
      ${admin?`<button class="sys" data-act="goto" data-to="sensors" title="${t('sensors')}"><span class="dot live" style="color:var(--${ss.off?'cau':'ok'});background:var(--${ss.off?'cau':'ok'})"></span><span><span class="num">${ss.on}/${ss.tot}</span> <span class="lbl">${A('مستشعر متصل','sensors online')}</span></span></button>`:''}
      <div class="clock"><span class="t num" id="clk">${clockStr(S.clock)}</span><span class="d">${t('demoDate')}</span></div>
      <div class="rel"><button class="icon-btn" data-act="menu" data-k="bell" aria-label="${admin?t('alerts'):A('مهامي','My tasks')}" aria-expanded="${S.menu==='bell'}">${I.bell}${(admin?un:myNew)?'<span class="badge-dot"></span>':''}</button>${S.menu==='bell'?(admin?bellPanel():tasksBell()):''}</div>
      <div class="top-prefs">${prefsCtl()}</div>
      <div class="rel"><button class="user ${S.menu==='user'?'open':''}" data-act="menu" data-k="user" aria-haspopup="menu" aria-expanded="${S.menu==='user'}"><div class="avatar av-${ME().dept}">${L(ME().name).trim()[0]}</div><div><div class="n">${L(ME().name)}</div><div class="r">${L(ME().title)}</div></div></button>${S.menu==='user'?userMenu():''}</div>
    </header>
    <main class="page fade-in" id="page">${content}</main>
  </div></div>`;
};
bindLogin=function(){
  const f=document.getElementById('loginForm');
  f&&f.addEventListener('submit',e=>{e.preventDefault();
    const em=document.getElementById('em').value.trim().toLowerCase(), m=S.team.find(x=>x.email.toLowerCase()===em), err=document.getElementById('loginErr');
    if(!m){err.textContent=A('لا يوجد حساب بهذا البريد ضمن فرق التشغيل.','No operations account uses this email.');err.style.display='block';return}
    if(m.dept!==S.loginRole){err.textContent=A(`هذا الحساب ليس ضمن «${ROLECFG[S.loginRole].t.ar}». اختر الفئة الصحيحة.`,`This account isn’t in “${ROLECFG[S.loginRole].t.en}”. Pick the right role.`);err.style.display='block';return}
    if(m.off){err.textContent=A('هذا الحساب خارج الدوام حاليًا.','This account is off shift.');err.style.display='block';return}
    const b=document.getElementById('loginBtn');b.disabled=true;b.textContent=t('signingIn');
    setTimeout(()=>{S.userId=m.id;S.loginRole=m.dept;S.loginUser=m.id;S.authed=true;applyPermCss();bumpStep(1);
      location.hash='#/'+ROLECFG[m.dept].home;route();
      if(m.dept==='admin') setTimeout(()=>{S.newAlert='a1';toast(t('newAlert'))},1200);
      else{const nx=myTasks().filter(x=>x.status!=='done').sort((a,b)=>tmin(a.due)-tmin(b.due))[0];if(nx)setTimeout(()=>toast(A(`مهمتك التالية: ${nx.id} — الموعد ${nx.due}`,`Your next task: ${nx.id} — due ${nx.due}`)),1200)}},700)});
};

/* ---------- actions ---------- */
Object.assign(ACTPERM,{activatePart:'decide',rejectRec:'decide',restoreRec:'decide',repGen:'report',repDl:'report'});
const _taskStepAct=actions.taskStep;
Object.assign(actions,{
  sort:d=>{const s=S.sort[d.t];if(s.k===d.k)s.d=-s.d;else{s.k=d.k;s.d=+d.d||1}soft()},
  autoTab:d=>{S.autoTab=d.k;soft()},
  activate:d=>openActivate(d.id,false),
  activatePart:d=>openActivate(d.id,true),
  rejectRec:d=>{const z=Z(d.id),r=recFor(z);if(!r)return;z.recRejected=clockStr(S.clock);
    S.alerts.filter(a=>a.zone===z.id&&a.type==='heat'&&a.status==='active').forEach(a=>a.read=true);
    logAdd({ar:`رفض توصية: ${r.title.ar} — المنطقة ${z.id}`,en:`Recommendation rejected: ${r.title.en} — Zone ${z.id}`},{ar:'بواسطة نورة القحطاني',en:'by Noura Al-Qahtani'},'neutral','ops',{zone:z.id,res:'rejected'});
    toast(A(`تم رفض التوصية — ${zn(z.id)}`,`Recommendation rejected — Zone ${z.id}`));soft()},
  restoreRec:d=>{delete Z(d.id).recRejected;soft()},
  dismiss:()=>actions.rejectRec({id:S.selZone}),
  schedule:()=>{toast(t('scheduled'));logAdd({ar:`جدولة إجراء — المنطقة ${S.selZone}`,en:`Action scheduled — Zone ${S.selZone}`},{ar:'14:45 · بواسطة نورة القحطاني',en:'14:45 · by Noura Al-Qahtani'},'info','ops',{zone:S.selZone,res:'scheduled'});soft()},
  dvSel:d=>{(S.dv[d.c]||(S.dv[d.c]={})).id=d.id;if(d.c.startsWith('modal:'))return openDevHist(d.c.slice(6));soft();if(d.scroll){const el=document.getElementById(d.c.startsWith('auto:')?'autoDv':'zoneDv');el&&el.scrollIntoView({behavior:'smooth',block:'start'})}},
  dvMet:d=>{(S.dv[d.c]||(S.dv[d.c]={})).m=d.k;if(d.c.startsWith('modal:'))return openDevHist(d.c.slice(6));soft()},
  taskLoc:d=>openTaskLoc(d.id),
  taskStepM:d=>{closeModal();_taskStepAct(d)},
  export:()=>{if(!S.rep.secs.includes(S.anTab))S.rep.secs=[...S.rep.secs,S.anTab];go('reports')},
  repPre:d=>{const p=REP_PRE.find(x=>x[0]===d.k);S.rep.preset=d.k;if(p[2]){S.rep.from=p[2];S.rep.to=p[3]}S.rep.err='';soft()},
  repZones:d=>{S.rep.zones=d.k==='all'?S.zones.map(z=>z.id):d.k==='none'?[]:S.zones.filter(z=>{const s=stOf(z.utci);return d.k==='crit'?s==='crit':(s==='cau'||s==='heat')}).map(z=>z.id);S.rep.err='';soft()},
  repGen:()=>{const r=S.rep;r.err=!r.zones.length?A('اختر منطقة واحدة على الأقل.','Pick at least one zone.'):!r.secs.length?A('اختر قسمًا واحدًا على الأقل من محتوى التقرير.','Pick at least one content section.'):r.from>r.to?A('تاريخ البداية بعد تاريخ النهاية.','The start date is after the end date.'):'';
    if(r.err){soft();return}
    r.gen={preset:r.preset,from:r.from,to:r.to,zones:[...r.zones],secs:[...r.secs]};soft();exportReport(repData(r.gen),r.fmt)},
  repDl:d=>{if(S.rep.gen)exportReport(repData(S.rep.gen),d.k)},
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.matches('.pick input')) return updatePick();
  const k=el.dataset&&el.dataset.chg; if(!k||!k.startsWith('rep')) return;
  const r=S.rep; r.err='';
  if(k==='repDate'){r[el.dataset.k]=el.value;r.preset='custom'}
  if(k==='repZone'){r.zones=el.checked?[...new Set([...r.zones,el.value])]:r.zones.filter(z=>z!==el.value);r.zones.sort()}
  if(k==='repSec'){r.secs=el.checked?[...r.secs,el.value]:r.secs.filter(s=>s!==el.value);r.secs=AN_TABS.map(a=>a[0]).filter(s=>r.secs.includes(s))}
  if(k==='repFmt') r.fmt=el.value;
  soft();
});
document.addEventListener('keydown',ev=>{
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr.click[data-act]')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});


window.addEventListener('hashchange',()=>{if(S.authed)route()});
setInterval(()=>{S.clock=new Date(S.clock.getTime()+1000);const c=document.getElementById('clk');if(c)c.textContent=clockStr(S.clock)},1000);
render();
</script>
</body>
