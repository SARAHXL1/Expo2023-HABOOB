<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هبوب | HABOOB — Smart Outdoor Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F2ED; --bg2:#ECE7DD; --surface:#FFFFFF; --surface2:#FAF8F4;
  --ink:#22201C; --ink2:#5A554C; --ink3:#8F887B; --line:#E3DDD1; --line2:#D6CEBE;
  --sand:#D9C49F; --sand-deep:#A8834F; --sand-soft:#F1E8D8;
  --brand:#1F6B4F; --brand-ink:#FFFFFF; --brand-soft:#E3EFE8;
  --ok:#2E8A5A; --ok-bg:#E4F2EA; --cau:#C9940E; --cau-bg:#FBF1D6; --heat:#D9661F; --heat-bg:#FCE8DA; --crit:#C2362B; --crit-bg:#F9E1DE;
  --info:#2F6C8F; --info-bg:#E1EDF4;
  --glass:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 24px -12px rgba(60,45,20,.18);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --side:248px;
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16150F; --bg2:#1E1C16; --surface:#211F19; --surface2:#1A1914;
    --ink:#F1ECE2; --ink2:#C2BAAA; --ink3:#8B8475; --line:#34302705; --line:#332F26; --line2:#454033;
    --sand:#8E7650; --sand-deep:#D3B583; --sand-soft:#2A261D;
    --brand:#4FB287; --brand-ink:#0E1A14; --brand-soft:#1D3128;
    --ok:#4FB287; --ok-bg:#1B2E24; --cau:#E5B53A; --cau-bg:#352C14; --heat:#EE8A4A; --heat-bg:#3A2416; --crit:#EE6A5E; --crit-bg:#3B1C19;
    --info:#6BA9CF; --info-bg:#182A35; --glass:rgba(33,31,25,.78);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#16150F; --bg2:#1E1C16; --surface:#211F19; --surface2:#1A1914;
  --ink:#F1ECE2; --ink2:#C2BAAA; --ink3:#8B8475; --line:#332F26; --line2:#454033;
  --sand:#8E7650; --sand-deep:#D3B583; --sand-soft:#2A261D;
  --brand:#4FB287; --brand-ink:#0E1A14; --brand-soft:#1D3128;
  --ok:#4FB287; --ok-bg:#1B2E24; --cau:#E5B53A; --cau-bg:#352C14; --heat:#EE8A4A; --heat-bg:#3A2416; --crit:#EE6A5E; --crit-bg:#3B1C19;
  --info:#6BA9CF; --info-bg:#182A35; --glass:rgba(33,31,25,.78);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:26px;line-height:1.25}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.sm{font-size:12.5px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;transition:width .25s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-weight:700;font-size:19px;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500;position:relative;transition:background .15s,color .15s}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.nav .count{margin-inline-start:auto;background:var(--crit);color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav-sep{height:1px;background:var(--line);margin:12px 8px}
.side-foot{margin-top:auto;padding:12px;border-radius:var(--r-md);background:var(--sand-soft);font-size:12.5px;color:var(--ink2)}
.side-foot b{color:var(--ink);display:block;margin-bottom:2px}
.loop{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.loop span{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .crumb{font-weight:600;font-size:15px}
.top .spacer{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
[dir=rtl] .clock{align-items:flex-start}
.clock .t{font-weight:600;font-size:15px}
.clock .d{font-size:11.5px;color:var(--ink3)}
.sys{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.live{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.icon-btn:hover{border-color:var(--line2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .badge-dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink3)}
.lang button.on{background:var(--ink);color:var(--bg)}
.user{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;border-radius:12px}
[dir=rtl] .user{padding:4px 12px 4px 4px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--sand),var(--sand-deep));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.user .n{font-weight:600;font-size:13px;line-height:1.2}
.user .r{font-size:11.5px;color:var(--ink3)}
.page{padding:24px 28px 80px;max-width:1600px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin-top:4px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--sand-soft);color:var(--sand-deep);font-weight:600;border:1px dashed var(--sand)}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head p{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px;border:1px solid transparent;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface2)}
.btn-text{background:none;color:var(--ink2);padding:9px 10px}
.btn-text:hover{color:var(--ink)}
.btn-danger{background:var(--crit);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.badge .dot{width:7px;height:7px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-ok .dot{background:var(--ok)}
.b-cau{background:var(--cau-bg);color:var(--cau)} .b-cau .dot{background:var(--cau)}
.b-heat{background:var(--heat-bg);color:var(--heat)} .b-heat .dot{background:var(--heat)}
.b-crit{background:var(--crit-bg);color:var(--crit)} .b-crit .dot{background:var(--crit)}
.b-info{background:var(--info-bg);color:var(--info)} .b-info .dot{background:var(--info)}
.b-neutral{background:var(--bg2);color:var(--ink2)} .b-neutral .dot{background:var(--ink3)}
.b-ai{background:linear-gradient(90deg,var(--brand-soft),var(--sand-soft));color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-size:5px 5px;background-repeat:no-repeat;background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%}
[dir=rtl] select.input{background-position:18px 50%,13px 50%}
.switch{width:40px;height:23px;border-radius:12px;background:var(--line2);border:0;position:relative;transition:background .2s;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--brand)}
.switch.on::after{inset-inline-start:20px}
.seg{display:inline-flex;background:var(--bg2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--ink3);text-align:start;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr.click:hover{background:var(--surface2);cursor:pointer}
.scroll-x{overflow-x:auto}
.empty{padding:40px;text-align:center;color:var(--ink3)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;cursor:default}
.kpi .k-label{font-size:12.5px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .k-val{font-size:32px;font-weight:600;line-height:1;transition:color .3s}
.kpi .k-foot{font-size:11.5px;color:var(--ink3)}
.kpi .bar{position:absolute;inset-inline-start:0;top:16px;bottom:16px;width:3px;border-radius:3px}
.kpi.flash .k-val{animation:flash 1.2s ease}
@keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- Map ---------- */
.map-wrap{position:relative;width:100%;aspect-ratio:1/1;max-height:720px;margin-inline:auto}
.map-wrap svg{width:100%;height:100%;display:block;direction:ltr}
.zone-shape{cursor:pointer;transition:filter .15s,stroke-width .15s}
.zone-shape:hover{filter:brightness(1.05) saturate(1.2);stroke-width:2.6}
.zone-shape.sel{stroke-width:3.2}
.zone-label{pointer-events:none;font-weight:600;font-family:inherit}
.crit-pulse{animation:cpulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes cpulse{0%,100%{opacity:.25}50%{opacity:.75}}
.pole{cursor:pointer}
.pole .ring{animation:pring 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.flash-ring{animation:fring 1.6s ease-out 3;transform-origin:center;transform-box:fill-box}
@keyframes fring{0%{opacity:1;stroke-width:6}100%{opacity:0;stroke-width:22}}
.map-pop{position:absolute;z-index:5;min-width:220px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;transform:translate(-50%,calc(-100% - 14px));font-size:12.5px;animation:popin .18s ease}
@keyframes popin{from{opacity:0;transform:translate(-50%,calc(-100% - 6px))}}
.map-pop .rows{display:grid;grid-template-columns:auto auto;gap:4px 18px;margin-top:8px}
.map-pop .rows span:nth-child(odd){color:var(--ink3)}
.map-pop .rows span:nth-child(even){font-weight:600;text-align:end}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.layer-list{display:flex;flex-direction:column;gap:2px}
.layer{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.layer:last-child{border-bottom:0}
.layer .sw{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.layer .sw svg{width:15px;height:15px}
.layer .txt{flex:1;line-height:1.3}
.layer .txt small{display:block;color:var(--ink3);font-size:11.5px}

/* ---------- Overview ---------- */
.ov-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:18px;align-items:start}
.quick{padding:18px 20px}
.quick-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.metric{padding:11px 13px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.metric .ml{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.metric .ml svg{width:14px;height:14px}
.metric .mv{font-size:19px;font-weight:600;margin-top:2px}
.metric .mv small{font-size:12px;color:var(--ink3);font-weight:500;margin-inline-start:2px}
.utci-hero{display:flex;align-items:baseline;gap:6px}
.utci-hero .v{font-size:44px;font-weight:600;line-height:1}
.alert-row{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:flex-start;transition:background .12s}
.alert-row:last-child{border-bottom:0}
.alert-row:hover{background:var(--surface2)}
.sev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.sev svg{width:17px;height:17px}
.sev.crit{background:var(--crit-bg);color:var(--crit)}
.sev.heat{background:var(--heat-bg);color:var(--heat)}
.sev.cau{background:var(--cau-bg);color:var(--cau)}
.sev.info{background:var(--info-bg);color:var(--info)}
.sev.ok{background:var(--ok-bg);color:var(--ok)}
.log{list-style:none;margin:0;padding:6px 20px 14px}
.log li{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;padding:9px 0;align-items:start;position:relative}
.log li .lt{font-size:12px;color:var(--ink3);padding-top:1px}
.log li .ld{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--line2);position:relative}
.log li:not(:last-child) .ld::after{content:"";position:absolute;top:12px;left:4px;width:1px;height:34px;background:var(--line)}
.log li .lx{font-size:13px}
.log li .lx small{display:block;color:var(--ink3);font-size:11.5px}
.log li.new{animation:newrow 2.4s ease}
@keyframes newrow{0%{background:var(--brand-soft)}100%{background:transparent}}

/* ---------- Zone details ---------- */
.zd-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.zd-status{padding:22px 24px;position:relative;overflow:hidden}
.zd-status .big{font-size:64px;font-weight:600;line-height:1;letter-spacing:-.02em}
.zd-status .big small{font-size:22px;color:var(--ink3);font-weight:500}
.scale{margin-top:20px}
.scale-bar{display:grid;grid-template-columns:repeat(5,1fr);height:12px;border-radius:6px;overflow:hidden;gap:2px;direction:ltr}
.scale-bar div:nth-child(1){background:#7DBF9A}.scale-bar div:nth-child(2){background:#E2C25B}.scale-bar div:nth-child(3){background:#E79A4F}.scale-bar div:nth-child(4){background:#D9563A}.scale-bar div:nth-child(5){background:#8E1F1A}
.scale-track{position:relative;height:22px;direction:ltr}
.scale-pin{position:absolute;top:0;transform:translateX(-50%);transition:left 1.2s cubic-bezier(.3,.8,.2,1);display:flex;flex-direction:column;align-items:center}
.scale-pin::before{content:"";width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid var(--ink)}
.scale-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font-size:11px;color:var(--ink3);margin-top:6px;direction:ltr;text-align:center}
[dir=rtl] .scale-labels span{direction:rtl}
.scale-labels span.on{color:var(--ink);font-weight:600}
.env-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.env{padding:16px 18px}
.env .el{display:flex;align-items:center;justify-content:space-between;color:var(--ink2);font-size:12.5px}
.env .el svg{width:18px;height:18px;color:var(--ink3)}
.env .ev{font-size:28px;font-weight:600;margin-top:6px;line-height:1.1}
.env .ev small{font-size:13px;color:var(--ink3);font-weight:500}
.env .eh{font-size:11.5px;margin-top:6px}
.env.flagged{border-color:color-mix(in srgb,var(--heat) 45%,var(--line))}
.env.flagged .eh{color:var(--heat);font-weight:600}
.rec{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--brand-soft) 70%,var(--surface)) 0%,var(--surface) 60%)}
.rec-in{padding:22px 24px}
.rec .ttl{font-size:22px;font-weight:600;margin:10px 0 8px}
.rec .why{color:var(--ink2);max-width:62ch}
.rec .impact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rec .impact div{padding:10px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.rec .impact b{display:block;font-size:17px}
.rec .impact span{font-size:11.5px;color:var(--ink3)}
.rec .acts{display:flex;gap:8px;flex-wrap:wrap}
.rec.done{border-color:color-mix(in srgb,var(--ok) 35%,var(--line));background:linear-gradient(160deg,var(--ok-bg),var(--surface) 65%)}

.dev-row:last-child{border-bottom:0}
.dev-ic{width:36px;height:36px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;flex:none;color:var(--ink2)}
.dev-ic svg{width:18px;height:18px}
.dev-ic.on{background:var(--brand-soft);color:var(--brand)}

/* ---------- Alerts ---------- */
.alert-card{display:grid;grid-template-columns:auto 1fr auto;gap:16px;padding:18px 20px;align-items:start;border-inline-start:4px solid transparent}
.alert-card.crit{border-inline-start-color:var(--crit)}
.alert-card.heat{border-inline-start-color:var(--heat)}
.alert-card.cau{border-inline-start-color:var(--cau)}
.alert-card.info{border-inline-start-color:var(--info)}
.alert-card.resolved{opacity:.72;border-inline-start-color:var(--ok)}
.alert-card .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-top:2px}
.alert-card .rec-line{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert-card .rec-line svg{width:16px;height:16px;color:var(--brand);flex:none;margin-top:2px}
.alert-card .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:130px}

@keyframes alertIn{from{transform:translateY(-6px);opacity:0}}

/* ---------- Modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(25,20,12,.42);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}}
.modal-h{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-b{padding:16px 24px}
.modal-f{padding:16px 24px 22px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps-list li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px}
.steps-list li .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line2)}
.steps-list li.doing .st{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.steps-list li.done .st{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps-list li.done .st svg{width:13px;height:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.success-mark{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:4px auto 14px}
.success-mark svg{width:32px;height:32px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare > div{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.compare > div.best{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));background:var(--brand-soft)}
.compare dl{display:grid;grid-template-columns:auto auto;gap:6px 12px;margin:10px 0 0;font-size:13px}
.compare dt{color:var(--ink3)} .compare dd{margin:0;font-weight:600;text-align:end}
.toasts{position:fixed;bottom:22px;inset-inline-start:22px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:13.5px;animation:rise .25s ease;max-width:380px}
.toast svg{width:18px;height:18px;flex:none;color:var(--brand)}

/* ---------- Demo guide ---------- */
.guide{position:fixed;bottom:22px;inset-inline-end:22px;z-index:50;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;width:280px;font-size:12.5px}
.guide-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.guide ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.guide li{display:flex;gap:8px;align-items:center;color:var(--ink3)}
.guide li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:10px;flex:none}
.guide li.done{color:var(--ink2)} .guide li.done i{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.guide li.cur{color:var(--ink);font-weight:600} .guide li.cur i{border-color:var(--brand);color:var(--brand)}
.guide.min ol{display:none}
.guide.min{width:auto}

.stat span{font-size:12px;color:var(--ink3)}

.pending{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.pending:last-child{border-bottom:0}

.pole-spec span{font-size:12px;color:var(--ink3)}

.batt i::after{content:"";position:absolute;top:1px;bottom:1px;left:1px;width:var(--w);border-radius:1px;background:var(--c)}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}

.swatch div{height:58px}
.swatch p{padding:8px 10px;font-size:12px}
.swatch p b{display:block;font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}

.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.ia{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ia div{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.ia b{display:block;font-size:13.5px;margin-bottom:4px}
.ia span{font-size:12px;color:var(--ink3)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow span{padding:8px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500}
.flow em{font-style:normal;color:var(--ink3)}
[dir=rtl] .flow em{transform:scaleX(-1);display:inline-block}

.fade-in{animation:fade .3s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}.env-grid{grid-template-columns:repeat(2,1fr)}.sys-cards{grid-template-columns:repeat(2,1fr)}}

function lineChart({series,labels,yMin,yMax,h=230,w=640,thresh,forecastFrom,yUnit='°'}){
  const pl=34,pr=10,pt=12,pb=26, iw=w-pl-pr, ih=h-pt-pb;
  const x=i=>pl+i*(iw/(labels.length-1)), y=v=>pt+ih-(v-yMin)/(yMax-yMin)*ih;
  let g='';
  const ticks=5;
  for(let i=0;i<=ticks;i++){const v=yMin+(yMax-yMin)*i/ticks;g+=`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}${yUnit}</text>`}
  labels.forEach((l,i)=>{if(l!=='')g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`});
  if(thresh) g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(thresh.v)}" y2="${y(thresh.v)}" stroke="var(--crit)" stroke-dasharray="4 4" stroke-width="1.2" opacity=".7"/>`;
  if(forecastFrom!=null) g+=`<rect x="${x(forecastFrom)}" y="${pt}" width="${w-pr-x(forecastFrom)}" height="${ih}" fill="var(--sand-soft)" opacity=".6"/><text x="${x(forecastFrom)+6}" y="${pt+12}" style="fill:var(--sand-deep);font-weight:600">${t('predicted')}</text>`;
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>v==null?null:[x(i),y(v)]);
    let d='',fd='';
    pts.forEach((p,i)=>{if(!p)return; if(forecastFrom!=null&&i>forecastFrom){fd+=(fd?'L':'M')+p.join(',')} else {d+=(d?'L':'M')+p.join(',')}
      if(forecastFrom!=null&&i===forecastFrom) fd='M'+p.join(',')});
    if(s.area){const first=pts.findIndex(p=>p),lastI=forecastFrom??pts.length-1;g+=`<path d="${d}L${x(lastI)},${pt+ih}L${x(first)},${pt+ih}Z" fill="${s.color}" opacity=".09"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(fd) g+=`<path d="${fd}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-dasharray="5 5" stroke-linecap="round"/>`;
    if(s.dotAt!=null){const p=pts[s.dotAt];g+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5"/>`}
  });
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`;
}

  const large=(a1-a0)>Math.PI?1:0, p1=pol(r1,a0),p2=pol(r1,a1),p3=pol(r0,a1),p4=pol(r0,a0);
  return `M${p1}A${r1},${r1} 0 ${large} 1 ${p2}L${p3}A${r0},${r0} 0 ${large} 0 ${p4}Z`;
}

      s+=`<g data-act="goto" data-to="events" style="cursor:pointer"><rect x="${mx-11}" y="${my-11}" width="22" height="22" rx="6" fill="var(--surface)" stroke="${c}" stroke-width="2"/><path d="M${mx-5},${my-1}h10M${mx-5},${my+3}h6" stroke="${c}" stroke-width="2" stroke-linecap="round"/><title>${L(e.name)} · ${e.time}</title></g>`});
  }

  if(ly.poles){

    });

  [['N',400,18],['E',782,400],['S',400,786],['W',18,400]].forEach(([l,x,y])=>s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="var(--ink3)">${l}</text>`);
  s+='</svg>';
  let pop='';
  if(S.popPole){const p=S.sensors.find(x=>x.id===S.popPole);const [px,py]=polePos(p);
    pop=`<div class="map-pop" style="left:${px/8}%;top:${py/8}%"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b class="num">${p.id}</b>${sensBadge(p.status)}</div>

  return `<div class="map-wrap" id="map">${s}${pop}</div>`;
}

      <div style="padding:14px 20px 16px">${lineChart({series:[{data:series,color:`var(--${st})`,area:true,dotAt:6}],labels:hrs.map(h=>h),yMin:24,yMax:48,h:210,forecastFrom:6,thresh:{v:38}})}</div></div>
  </div>

}
function devStatusBadge(s){return s==='on'?`<span class="badge b-ok"><span class="dot"></span>${t('on')}</span>`:s==='pending'?`<span class="badge b-cau"><span class="dot"></span>${t('pending')}</span>`:`<span class="badge b-neutral"><span class="dot"></span>${t('off')}</span>`}
function devRow(d){return `<div class="dev-row"><div class="dev-ic ${d.status==='on'?'on':''}">${SYSI[d.sys]}</div><div style="flex:1"><b>${t(d.sys)}</b><div class="faint sm">${t(d.mode)} · UTCI > ${d.th}°</div></div>${devStatusBadge(d.status)}</div>`}

function pageAlerts(){
  const f=S.alertFilter;
  const list=S.alerts.filter(a=>f==='all'||a.status===f);
  const n=k=>S.alerts.filter(a=>k==='all'||a.status===k).length;
  return `<div class="page-head"><div><h1>${t('alerts')}</h1><p class="muted">${t('alertsSub')}</p></div>
    <div class="chips">${[['all','all'],['active','active'],['progress','inProgress'],['resolved','resolved']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="afilter" data-k="${k}">${t(l)} <span class="num">${n(k)}</span></button>`).join('')}</div></div>
  <div class="grid" style="gap:12px">${list.map(a=>{
    const z=Z(a.zone), sevCls=a.status==='resolved'?'resolved':a.sev;
    const stB=a.status==='active'?`<span class="badge b-crit"><span class="dot"></span>${t('active')}</span>`:a.status==='progress'?`<span class="badge b-info"><span class="dot"></span>${t('inProgress')}</span>`:`<span class="badge b-ok"><span class="dot"></span>${t('resolved')}</span>`;
    let acts='';
    if(a.status==='active'){
      if(a.type==='heat') acts=`<button class="btn btn-primary btn-sm" data-act="alertgo" data-id="${a.id}">${t('viewZone')}</button><button class="btn btn-ghost btn-sm" data-act="activate" data-id="${a.zone}">${t('activate')}</button>`;
      if(a.type==='event') acts=`<button class="btn btn-primary btn-sm" data-act="optimize" data-id="${a.ev}">${t('optimize')}</button><button class="btn btn-ghost btn-sm" data-act="openzone" data-id="${a.zone}">${t('viewZone')}</button>`;
      if(a.type==='sensor') acts=`<button class="btn btn-primary btn-sm" data-act="dispatch" data-id="${a.id}">${t('dispatch')}</button><button class="btn btn-ghost btn-sm" data-act="goto" data-to="sensors">${t('sensors')}</button>`;
    } else acts=`<button class="btn btn-ghost btn-sm" data-act="openzone" data-id="${a.zone}">${t('viewZone')}</button>`;
    return `<div class="card alert-card ${sevCls}"><div class="sev ${a.status==='resolved'?'ok':a.sev}">${a.type==='event'?I.events:a.type==='sensor'?I.sensor:I.alert}</div>
      <div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>${L(a.title)}</h3>${stB}</div>
      <div class="meta"><span class="badge b-${a.sev==='info'?'info':a.sev}" style="padding:1px 8px">${t('sev_'+a.sev)}</span><span>${zfull(z)}</span><span class="num">${a.time}</span>${a.type==='heat'?`<span>UTCI <b class="num" style="color:var(--${stOf(z.utci)})">${z.utci.toFixed(1)}°</b></span>`:''}</div>
      <p style="margin-top:8px">${L(a.problem)}</p>
      <div class="rec-line">${I.spark}<span><b>${t('recommended')}:</b> ${L(a.rec)}</span></div></div>
      <div class="acts">${acts}</div></div>`}).join('')||`<div class="card empty">—</div>`}</div>`;
}

const riskBadge = r => `<span class="badge ${r==='low'?'b-ok':r==='mod'?'b-cau':r==='high'?'b-heat':'b-crit'}"><span class="dot"></span>${t('risk_'+r)}</span>`;

  </div>`;

    ...S.zones.filter(z=>stOf(z.utci)==='crit'&&!z.mitigated&&!S.devices.some(d=>d.zone===z.id&&d.status==='on')).map(z=>({kind:'ai',z}))];
  const list=S.devices.filter(d=>f==='all'||d.sys===f);
  return `<div class="page-head"><div><h1>${t('automation')}</h1><p class="muted">${t('autoSub')}</p></div></div>
  <div class="card flow-strip" style="margin-bottom:18px">${['flow1','flow2','flow3','flow4'].map((k,i)=>`<div class="fs"><span class="num" style="${i===1?'background:var(--brand);color:var(--brand-ink)':''}">${i+1}</span>${t(k)}</div>${i<3?`<span class="arr">${I.arrow.replace('<svg','<svg width="16" height="16"')}</span>`:''}`).join('')}<span style="flex:1"></span><span class="faint sm">${LANG==='ar'?'القواعد المتكررة منخفضة المخاطر فقط تعمل دون اعتماد.':'Only low-risk repeat rules run without sign-off.'}</span></div>
  <div class="sys-cards">${SYS.map(s=>{const ds=S.devices.filter(d=>d.sys===s),on=ds.filter(d=>d.status==='on').length;return `<div class="card sys-card ${f===s?'on':''}" data-act="sysf" data-k="${s}" role="button" tabindex="0"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="si">${SYSI[s]}</div><span class="faint sm">${s==='misting'?'<span class="num">'+on*120+'</span> L/h':s==='fans'||s==='coolingSys'?'<span class="num">'+(on*4.2).toFixed(1)+'</span> kW':''}</span></div><h3 style="margin-top:12px">${t(s)}</h3><div class="muted sm"><b class="num" style="color:var(--ink);font-size:18px">${on}</b> / <span class="num">${ds.length}</span> ${t('activeUnits')}</div></div>`}).join('')}</div>
  ${pend.length?`<div class="card" style="margin-bottom:18px;border-color:color-mix(in srgb,var(--cau) 40%,var(--line))"><div class="card-head"><div><h3>${t('pendingTitle')} <span class="num faint">(${pend.length})</span></h3><p>${t('pendingSub')}</p></div></div>
  ${pend.map(p=>p.kind==='rule'?`<div class="pending"><div class="dev-ic">${SYSI[p.d.sys]}</div><div style="flex:1"><b>${t(p.d.sys)} — ${zn(p.d.zone)}</b><div class="sm muted">${LANG==='ar'?'تحققت القاعدة':'Rule triggered'}: UTCI ${Z(p.d.zone).utci.toFixed(1)}° > ${p.d.th}° · ${L(p.d.last)}</div></div><button class="btn btn-ghost btn-sm" data-act="reject" data-id="${p.d.id}">${t('reject')}</button><button class="btn btn-primary btn-sm" data-act="approveDev" data-id="${p.d.id}">${t('approveBtn')}</button></div>`
   :`<div class="pending"><div class="dev-ic" style="background:var(--brand-soft);color:var(--brand)">${I.spark}</div><div style="flex:1"><b>${L(recFor(p.z).title)} — ${zn(p.z.id)}</b><div class="sm muted">${t('recTitle')} · UTCI ${p.z.utci.toFixed(1)}° · ${t('confidence')} ${recFor(p.z).conf}%</div></div><button class="btn btn-ghost btn-sm" data-act="openzone" data-id="${p.z.id}">${t('viewZone')}</button><button class="btn btn-primary btn-sm" data-act="activate" data-id="${p.z.id}">${t('approveBtn')}</button></div>`).join('')}</div>`:''}
  <div class="card scroll-x"><div class="card-head"><h3>${t('devices')}</h3><div class="chips"><button class="chip ${f==='all'?'on':''}" data-act="sysf" data-k="all">${t('all')}</button>${SYS.map(s=>`<button class="chip ${f===s?'on':''}" data-act="sysf" data-k="${s}">${t(s)}</button>`).join('')}</div></div>
  <table class="tbl"><thead><tr><th>${t('d_system')}</th><th>${t('d_zone')}</th><th>${t('d_status')}</th><th>${t('d_mode')}</th><th>${t('d_trigger')}</th><th>${t('d_last')}</th><th></th></tr></thead><tbody>
  ${list.map(d=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="dev-ic ${d.status==='on'?'on':''}" style="width:30px;height:30px">${SYSI[d.sys]}</div><b>${t(d.sys)}</b></div></td><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="dot" style="background:var(--${stOf(Z(d.zone).utci)})"></span>${zn(d.zone)} <span class="num faint sm">${Z(d.zone).utci.toFixed(1)}°</span></span></td><td>${devStatusBadge(d.status)}</td>

  <td style="white-space:nowrap">${d.status==='on'?`<button class="btn btn-ghost btn-sm" data-act="devoff" data-id="${d.id}">${t('turnOff')}</button>`:`<button class="btn btn-dark btn-sm" data-act="devon" data-id="${d.id}">${t('turnOn')}</button>`} <button class="btn btn-text btn-sm" data-act="config" data-id="${d.id}">${t('configure')}</button></td></tr>`).join('')}
  </tbody></table></div>`;
}

function pageAnalytics(){
  const hrs=Array.from({length:17},(_,i)=>i+7);
  const curve=(peak,shift=0,amp=13)=>hrs.map(h=>+(peak-amp+amp*Math.exp(-Math.pow((h-14.5-shift)/3.6,2))).toFixed(1));
  const perf=[['C',31],['K',27],['R',25],['A',21],['L',17],['D',11],['M',8],['T',6],['B',0]];
  const days=T.days[LANG==='ar'?0:1];
  const heatCols=['#F3EBDA','#EBD7A6','#E3B56B','#D9853F','#C2502C','#8E1F1A'];
  const cell=(d,h)=>{const v=27+11*Math.exp(-Math.pow((h-14.5)/3,2))+((d*7+h)%5)*.5+(d===5?1.5:0);return v<29?0:v<31?1:v<33?2:v<35?3:v<37?4:5};
  const phrs=Array.from({length:14},(_,i)=>i+9);
  const water=[[4.1,6.8],[4.4,6.8],[3.9,6.8],[4.6,6.8],[4.2,6.8],[4.8,6.8],[4.3,6.8]];
  const energy=[[1.9,2.7],[2.0,2.7],[1.8,2.7],[2.1,2.7],[2.0,2.7],[2.3,2.7],[2.0,2.7]];
  const pair=(arr,max,u)=>`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;direction:ltr">${arr.map((v,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end"><div style="display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center"><div title="${v[1]} ${u}" style="width:38%;height:${v[1]/max*100}%;background:var(--line2);border-radius:4px 4px 0 0"></div><div title="${v[0]} ${u}" style="width:38%;height:${v[0]/max*100}%;background:var(--brand);border-radius:4px 4px 0 0"></div></div><span class="faint" style="font-size:11px">${days[i]}</span></div>`).join('')}</div>`;
  const ws=Math.round((1-water.reduce((a,b)=>a+b[0],0)/water.reduce((a,b)=>a+b[1],0))*100);
  const es=Math.round((1-energy.reduce((a,b)=>a+b[0],0)/energy.reduce((a,b)=>a+b[1],0))*100);
  return `<div class="page-head"><div><h1>${t('analytics')}</h1><p class="muted">${t('anSub')}</p></div><span class="demo-tag">${t('demo')} · 8–14/11/2030</span></div>
  <div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
    <div class="card"><div class="card-head"><div><h3>${t('trendsT')}</h3><p>${t('trendsS')}</p></div>${legendRow([{c:'var(--crit)',l:zn('C')},{c:'var(--heat)',l:zn('A')},{c:'var(--ok)',l:zn('B')}])}</div>
      <div style="padding:14px 20px 16px">${lineChart({series:[{data:curve(44.5),color:'var(--crit)'},{data:curve(41.2,.3,12),color:'var(--heat)'},{data:curve(32,-.4,9),color:'var(--ok)'}],labels:hrs.map(h=>h%2?'':h+':00'),yMin:20,yMax:48,h:240,thresh:{v:38}})}</div></div>
    <div class="card"><div class="card-head"><div><h3>${t('zonePerfT')}</h3><p>${t('zonePerfS')}</p></div></div>
      <div style="padding:10px 20px 16px">${hBars(perf.map(([id,v])=>({label:`${zn(id)} · ${L(Z(id).name)}`,v,c:v>20?'var(--crit)':v>10?'var(--heat)':v>0?'var(--cau)':'var(--ok)'})),35,' '+t('hrs'))}</div></div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:18px">
    <div class="card"><div class="card-head"><div><h3>${t('peakT')}</h3><p>${t('peakS')}</p></div></div>
      <div style="padding:16px 20px 18px"><div style="display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;direction:ltr">
        ${days.map((d,di)=>`<span class="faint" style="font-size:11.5px;text-align:right">${d}</span><div class="heat-grid" style="grid-template-columns:repeat(${phrs.length},1fr)">${phrs.map(h=>`<div title="${d} ${h}:00" style="background:${heatCols[cell(di,h)]}"></div>`).join('')}</div>`).join('')}
        <span></span><div class="heat-grid" style="grid-template-columns:repeat(${phrs.length},1fr)">${phrs.map(h=>`<span class="faint" style="font-size:10.5px;text-align:center">${h%3===0?h:''}</span>`).join('')}</div>
      </div><div style="display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px" class="faint"><span>27°</span>${heatCols.map(c=>`<i style="width:22px;height:10px;border-radius:3px;background:${c};display:inline-block"></i>`).join('')}<span>38°+</span></div></div></div>
    <div class="card"><div class="card-head"><div><h3>${t('resT')}</h3><p>${t('resS')}</p></div>${legendRow([{c:'var(--brand)',l:t('haboobOps')},{c:'var(--line2)',l:t('baseline')}])}</div>
      <div style="padding:14px 20px 16px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div><div style="display:flex;justify-content:space-between;align-items:baseline"><b>${t('water')} <span class="faint sm">m³ × 100</span></b><span class="badge b-ok num">−${ws}%</span></div>${pair(water,7.5,'×100 m³')}</div>
        <div><div style="display:flex;justify-content:space-between;align-items:baseline"><b>${t('energy')} <span class="faint sm">MWh</span></b><span class="badge b-ok num">−${es}%</span></div>${pair(energy,3,'MWh')}</div>
      </div></div>
  </div>
  <div class="card" style="margin-top:18px"><div class="card-head"><h3>${t('effT')}</h3></div><div style="padding:16px 20px 20px" class="stat-row">

function modal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-bg" data-act="mclose-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const b=document.querySelector('.modal .btn-primary,.modal .btn-dark');b&&b.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function toast(msg){const el=document.createElement('div');el.className='toast';el.innerHTML=I.check+`<span>${msg}</span>`;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3600)}
const mHead=(title,sub)=>`<div class="modal-h"><div><h2>${title}</h2>${sub?`<p class="muted sm" style="margin-top:4px">${sub}</p>`:''}</div><button class="icon-btn" data-act="mclose" aria-label="${t('close')}">${I.x}</button></div>`;
function logAdd(x,s,c='brand'){S.log.unshift({t:clockStr(S.clock),x,s,c,isNew:true});setTimeout(()=>S.log.forEach(l=>l.isNew=false),2500)}

/* Main demo action: AI recommendation -> operator approval -> action */
function openActivate(zid){
  const z=Z(zid), rec=recFor(z); if(!rec) return;
  if(zid==='C') bumpStep(4);
  const cmds=rec.sys.map(s=>s==='shading'?'cmdShade':s==='misting'?'cmdMist':'cmdFans');
  modal(`${mHead(t('approveTitle')+' — '+zn(zid),L(z.name))}
  <div class="modal-b"><p class="muted">${t('approveP')}</p>
    <ul class="steps-list" style="margin-top:14px" id="cmdList">${[...cmds,'cmdVerify'].map(k=>`<li data-k="${k}"><span class="st"></span>${t(k)}</li>`).join('')}</ul>
    <div class="compare" style="margin-top:16px"><div><div class="faint sm">UTCI ${LANG==='ar'?'الآن':'now'}</div><div class="num" style="font-size:24px;font-weight:600;color:var(--${stOf(z.utci)})">${z.utci.toFixed(1)}°</div></div><div class="best"><div class="faint sm">${LANG==='ar'?'المتوقع بعد 6 دقائق':'Expected in 6 min'}</div><div class="num" style="font-size:24px;font-weight:600;color:var(--brand)">${(z.utci-rec.drop).toFixed(1)}°</div></div></div>
  </div>
  <div class="modal-f"><button class="btn btn-text" data-act="mclose">${t('cancel')}</button><button class="btn btn-primary" data-act="doActivate" data-id="${zid}">${t('approve')}</button></div>`);
}
function doActivate(zid){
  const z=Z(zid), rec=recFor(z);
  const btns=document.querySelectorAll('.modal-f .btn'); btns.forEach(b=>b.disabled=true);
  document.querySelector('.modal-f .btn-primary').textContent=t('sending');
  const items=[...document.querySelectorAll('#cmdList li')];
  let i=0;
  const step=()=>{
    if(i>0){items[i-1].classList.remove('doing');items[i-1].classList.add('done');items[i-1].querySelector('.st').innerHTML=I.check}
    if(i<items.length){items[i].classList.add('doing');i++;setTimeout(step,650)}
    else setTimeout(()=>finishActivate(zid,rec),350);
  };
  step();
}
function finishActivate(zid,rec){
  const z=Z(zid); const prevSt=stOf(z.utci);
  z.prev=z.utci;
  const target=+(z.utci-rec.drop).toFixed(1);
  z.mitigated=true;
  if(rec.sys.includes('shading')){z.solar=Math.round(z.solar*.24)}
  if(rec.sys.includes('misting')){z.temp=+(z.temp-3.2).toFixed(1);z.hum=z.hum+14}
  if(rec.sys.includes('fans')){z.wind=+(z.wind+2.1).toFixed(1)}
  z.utci=target;
  rec.sys.forEach(s=>{const d=D(zid+'-'+s); if(d){d.status='on';d.last={ar:`اعتمدته نورة ${clockStr(S.clock)}`,en:`Approved by Noura ${clockStr(S.clock)}`}}});
  S.alerts.filter(a=>a.zone===zid&&a.type==='heat'&&a.status!=='resolved').forEach(a=>a.status='resolved');
  logAdd({ar:`${L(rec.title)} — ${zn(zid)}`,en:`${rec.title.en} — Zone ${zid}`},{ar:`توصية هبوب · اعتمدتها نورة القحطاني · UTCI ${z.prev}° ← ${target}°`,en:`Haboob recommendation · approved by Noura Al-Qahtani · UTCI ${z.prev}° → ${target}°`});
  S.kpiFlash=['ok','attn','crit','alerts']; setTimeout(()=>S.kpiFlash=null,1500);
  if(zid==='C') bumpStep(6);
  const newSt=stOf(target);
  modal(`<div class="modal-b" style="text-align:center;padding-top:30px"><div class="success-mark">${I.check}</div><h2>${t('doneTitle')}</h2><p class="muted" style="margin-top:6px">${t('doneP')}</p>
    <div style="display:flex;justify-content:center;align-items:center;gap:14px;margin:20px 0 6px">${stBadge(prevSt)}<span class="faint">${LANG==='ar'?'←':'→'}</span>${stBadge(newSt)}</div>
    <div class="num faint">UTCI ${z.prev.toFixed(1)}° ${LANG==='ar'?'←':'→'} <b style="color:var(--${newSt})">${target.toFixed(1)}°</b></div></div>
    <div class="modal-f" style="justify-content:center"><button class="btn btn-ghost" data-act="mclose">${t('stayHere')}</button><button class="btn btn-primary" data-act="toOverviewFlash" data-id="${zid}">${t('backOverview')}</button></div>`);
  if(S.route==='zone') render();
}

function openOptimize(eid){
  const e=S.events.find(x=>x.id===eid); if(!e||!e.opt) return;
  const o=e.opt;
  modal(`${mHead(t('optTitle'),L(e.name)+' · '+e.visitors.toLocaleString('en')+' '+t('visitors'))}
  <div class="modal-b" id="optBody"><div style="display:flex;align-items:center;gap:10px;padding:30px 0;justify-content:center" class="muted"><span class="st" style="width:20px;height:20px;border-radius:50%;border:2px solid var(--brand);border-top-color:transparent;animation:spin .8s linear infinite;display:inline-block"></span>${LANG==='ar'?'هبوب يحلل توقعات 24 منطقة…':'Haboob is analyzing forecasts for 24 zones…'}</div></div>
  <div class="modal-f"><button class="btn btn-text" data-act="mclose">${t('cancel')}</button><button class="btn btn-primary" data-act="applyOpt" data-id="${eid}" disabled id="applyBtn">${t('apply')}</button></div>`);
  setTimeout(()=>{const b=document.getElementById('optBody'); if(!b) return;
    b.innerHTML=`<div class="compare">
      <div><b>${t('current')}</b><dl><dt>${t('ev_zone')}</dt><dd>${zn(e.zone)}</dd><dt>${t('ev_time')}</dt><dd class="num">${e.time}</dd><dt>${t('expUtci')}</dt><dd class="num" style="color:var(--crit)">${e.utci}°</dd><dt>${t('wind')}</dt><dd class="num">${Z(e.zone).wind} m/s</dd></dl><div style="margin-top:10px">${riskBadge(e.risk)}</div></div>
      <div class="best"><b style="color:var(--brand)">${I.spark.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px"')} ${t('suggested')}</b><dl><dt>${t('bestZone')}</dt><dd>${zn(o.zone)}</dd><dt>${t('bestTime')}</dt><dd class="num">${o.time}</dd><dt>${t('expUtci')}</dt><dd class="num" style="color:var(--ok)">${o.utci}°</dd><dt>${t('wind')}</dt><dd class="num">${Z(o.zone).wind} m/s</dd></dl><div style="margin-top:10px">${riskBadge(o.utci<32?'low':'mod')}</div></div></div>
      <div class="rec-line" style="margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px"><b>${t('reason')}:</b> ${L(o.reason)}</div>`;
    document.getElementById('applyBtn').disabled=false;
  },900);
}

/* ---------------- Render & routing ---------------- */
function render(){
  const app=document.getElementById('app');
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.title=(LANG==='ar'?'هبوب':'HABOOB')+' | '+t(navKey[S.route]||'overview');
  if(!S.authed){app.innerHTML=pageLogin();bindLogin();return}
  const pages={overview:pageOverview,map:pageMap,zones:pageZones,zone:pageZone,alerts:pageAlerts,events:pageEvents,automation:pageAutomation,analytics:pageAnalytics,sensors:pageSensors,settings:pageSettings};
  const y=window.scrollY;
  app.innerHTML=shell((pages[S.route]||pageOverview)());
  if(S._keepScroll) window.scrollTo(0,y); S._keepScroll=false;
  const sq=document.getElementById('sq');
  if(sq){sq.addEventListener('input',e=>{S.sensorQ=e.target.value;const pos=e.target.selectionStart;S._keepScroll=true;render();const n=document.getElementById('sq');n.focus();n.setSelectionRange(pos,pos)})}
}
function soft(){S._keepScroll=true;render()}
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  S.route=NAV.some(n=>n[0]===h[0])||h[0]==='zone'?h[0]:'overview';
  S.param=h[1]||null; S.popPole=null;
  render(); window.scrollTo(0,0);
}
function go(r){location.hash='#/'+r}
function bindLogin(){
  const f=document.getElementById('loginForm');
  f&&f.addEventListener('submit',e=>{e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent=t('signingIn');
    setTimeout(()=>{S.authed=true;bumpStep(1);if(!location.hash||location.hash==='#/')location.hash='#/overview';route();
      setTimeout(()=>{S.newAlert='a1';toast(t('newAlert'));},1200);},700)});
}

const actions={
  lang:d=>{LANG=d.l;soft()},
  theme:()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');S.theme=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;soft()},
  setTheme:d=>{S.theme=d.k;if(d.k==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=d.k;soft()},
  goto:d=>go(d.to),
  zone:d=>{if(S.route==='overview'||S.route==='map'){S.selZone=d.id;S.popPole=null;soft()}else go('zone/'+d.id)},
  openzone:d=>go('zone/'+d.id),
  pole:d=>{S.popPole=S.popPole===d.id?null:d.id;soft()},
  layer:d=>{S.layers[d.k]=!S.layers[d.k];soft()},
  back:()=>history.length>1?history.back():go('overview'),
  alertgo:d=>{const a=S.alerts.find(x=>x.id===d.id);if(!a)return;if(a.id==='a1')bumpStep(2);
    if(a.type==='heat')go('zone/'+a.zone);else if(a.type==='event')openOptimize(a.ev);else go('sensors')},
  activate:d=>openActivate(d.id),
  doActivate:d=>doActivate(d.id),
  toOverviewFlash:d=>{closeModal();S.flash=d.id;S.selZone=d.id;if(d.id==='C')bumpStep(6);setTimeout(()=>{S.flash=null},5000);go('overview');setTimeout(()=>toast(L({ar:`تم تحديث حالة ${zn(d.id)}`,en:`Zone ${d.id} status updated`})),400)},
  schedule:()=>{toast(t('scheduled'));logAdd({ar:`جدولة إجراء — ${zn(S.selZone)}`,en:`Action scheduled — Zone ${S.selZone}`},{ar:'14:45 · بواسطة نورة القحطاني',en:'14:45 · by Noura Al-Qahtani'},'info')},
  dismiss:()=>{toast(t('dismissed'));logAdd({ar:`تجاهل توصية — ${zn(S.selZone)}`,en:`Recommendation dismissed — Zone ${S.selZone}`},{ar:'بواسطة نورة القحطاني',en:'by Noura Al-Qahtani'},'neutral')},
  mclose:()=>closeModal(),
  'mclose-bg':(d,el,ev)=>{if(ev.target===el)closeModal()},
  afilter:d=>{S.alertFilter=d.k;soft()},
  sfilter:d=>{S.sensorFilter=d.k;soft()},
  sysf:d=>{S.sysFilter=S.sysFilter===d.k&&d.k!=='all'?'all':d.k;soft()},
  optimize:d=>openOptimize(d.id),
  applyOpt:d=>{const e=S.events.find(x=>x.id===d.id);const o=e.opt;
    logAdd({ar:`نقل "${e.name.ar}" إلى ${zn(o.zone)} ${o.time}`,en:`Moved "${e.name.en}" to Zone ${o.zone} at ${o.time}`},{ar:'تحسين الفعاليات · اعتمدته نورة القحطاني',en:'Event optimization · approved by Noura Al-Qahtani'});
    e.zone=o.zone;e.time=o.time;e.utci=o.utci;e.risk=o.utci<32?'low':'mod';e.optimized=true;
    S.alerts.filter(a=>a.ev===e.id).forEach(a=>a.status='resolved');
    closeModal();toast(t('applied'));soft()},
  dispatch:d=>{const a=S.alerts.find(x=>x.id===d.id);a.status='progress';a.problem={ar:'تم إرسال فريق الصيانة — الوصول المتوقع خلال 12 دقيقة.',en:'Maintenance dispatched — expected on site in 12 minutes.'};
    logAdd({ar:'إرسال فريق الصيانة إلى HB-P13',en:'Maintenance dispatched to HB-P13'},{ar:'فريق المرافق · المنطقة M',en:'Facilities team · Zone M'},'info');toast(L({ar:'تم إرسال فريق الصيانة',en:'Maintenance dispatched'}));soft()},
  mode:d=>{const x=D(d.id);x.mode=d.m;soft()},
  devon:d=>{const x=D(d.id);modal(`${mHead(t('confirmOn'),`${t(x.sys)} — ${zfull(Z(x.zone))}`)}<div class="modal-b"><p class="muted">${t('confirmOnP')}</p></div><div class="modal-f"><button class="btn btn-text" data-act="mclose">${t('cancel')}</button><button class="btn btn-primary" data-act="approveDev" data-id="${x.id}">${t('turnOn')}</button></div>`)},
  approveDev:d=>{const x=D(d.id);x.status='on';x.last={ar:`اعتمدته نورة ${clockStr(S.clock)}`,en:`Approved by Noura ${clockStr(S.clock)}`};
    logAdd({ar:`تشغيل ${T[x.sys][0]} — المنطقة ${x.zone}`,en:`${T[x.sys][1]} on — Zone ${x.zone}`},{ar:'اعتماد يدوي · نورة القحطاني',en:'Manual approval · Noura Al-Qahtani'});
    closeModal();toast(L({ar:`تم تشغيل ${T[x.sys][0]} في المنطقة ${x.zone}`,en:`${T[x.sys][1]} turned on in Zone ${x.zone}`}));soft()},
  reject:d=>{const x=D(d.id);x.status='off';x.last={ar:`رفضه المشغل ${clockStr(S.clock)}`,en:`Rejected by operator ${clockStr(S.clock)}`};logAdd({ar:`رفض تشغيل ${T[x.sys][0]} — المنطقة ${x.zone}`,en:`${T[x.sys][1]} rejected — Zone ${x.zone}`},{ar:'نورة القحطاني',en:'Noura Al-Qahtani'},'neutral');soft()},
  devoff:d=>{const x=D(d.id);x.status='off';x.last={ar:`أوقفته نورة ${clockStr(S.clock)}`,en:`Stopped by Noura ${clockStr(S.clock)}`};logAdd({ar:`إيقاف ${T[x.sys][0]} — المنطقة ${x.zone}`,en:`${T[x.sys][1]} off — Zone ${x.zone}`},{ar:'نورة القحطاني',en:'Noura Al-Qahtani'},'neutral');toast(L({ar:'تم الإيقاف',en:'Turned off'}));soft()},
  config:d=>{const x=D(d.id);modal(`${mHead(t('configTitle'),`${t(x.sys)} — ${zfull(Z(x.zone))}`)}<div class="modal-b">
    <label class="f">${t('ruleWhen')}: <b class="num" id="thv">${x.th}°</b></label><input type="range" min="30" max="46" step="0.5" value="${x.th}" id="thr" style="width:100%;accent-color:var(--brand)" oninput="document.getElementById('thv').textContent=this.value+'°'">
    <div class="layer" style="margin-top:12px"><div class="txt">${t('requireApproval')}<small>${LANG==='ar'?'موصى به للأنظمة المستهلكة للمياه':'Recommended for water-consuming systems'}</small></div><button class="switch ${x.approval?'on':''}" id="apr" onclick="this.classList.toggle('on')" aria-label="${t('requireApproval')}"></button></div></div>
    <div class="modal-f"><button class="btn btn-text" data-act="mclose">${t('cancel')}</button><button class="btn btn-primary" data-act="saveCfg" data-id="${x.id}">${t('save')}</button></div>`)},
  saveCfg:d=>{const x=D(d.id);x.th=+document.getElementById('thr').value;x.approval=document.getElementById('apr').classList.contains('on');closeModal();toast(t('saved'));soft()},
  setTab:d=>{S.setTab=d.k;soft()},
  notif:d=>{S.notif[d.k]=!S.notif[d.k];soft()},
  guide:()=>{S.guideMin=!S.guideMin;soft()},
  logout:()=>{S.authed=false;S.demoStep=0;location.hash='';render()},
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=actions[el.dataset.act]; if(!a) return;
  if(el.tagName==='A') ev.preventDefault();
  a(el.dataset,el,ev);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape') closeModal();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('g[data-act],.sys-card')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
window.addEventListener('hashchange',()=>{if(S.authed)route()});
setInterval(()=>{S.clock=new Date(S.clock.getTime()+1000);const c=document.getElementById('clk');if(c)c.textContent=clockStr(S.clock)},1000);
render();
</script>
</body>
</html>
